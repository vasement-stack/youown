<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouOwn — 你的資料都在自己手上</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#00897b" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="YouOwn" />
  <link rel="icon" href="icon-192.png" />
  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" integrity="sha512-q+4liFwdPC/bNdhUpZx6aXDx/h77yEQtn4I1slHydcbZK34nLaR3cAeYSJshoxIOq3mjEf7xJE8YWIUHMn+oCQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Noto Sans TC", sans-serif; margin: 0; background: #f0f7f5; color: #1a2e2b; }
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 72px; background: #f0f7f5; }
    /* header */
    .header { background: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e0efeb; position: sticky; top: 0; z-index: 50; }
    .header h1 { font-size: 19px; font-weight: 700; margin: 0; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .btn-sync { background: #00897b; color: #fff; border: none; border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-add { background: #e8f5f3; color: #00897b; border: none; border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
    /* 快速記帳面板 */
    .qa-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end; }
    .qa-panel { background: #fff; border-radius: 20px 20px 0 0; padding: 24px; width: 100%; max-width: 480px; margin: 0 auto; max-height: 90vh; overflow-y: auto; }
    .qa-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
    .qa-label { font-size: 12px; opacity: 0.5; margin-bottom: 6px; }
    .qa-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; margin-bottom: 12px; }
    /* 分類篩選標籤列（消費/發票頁，橫向滑動） */
    .cat-filter-row { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; -webkit-overflow-scrolling: touch; margin-bottom: 6px; }
    .cat-filter-row::-webkit-scrollbar { display: none; }
    .cat-chip { flex-shrink: 0; padding: 6px 13px; border-radius: 20px; border: 1px solid #dde8e5; background: #fff; color: #556; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .cat-chip.active { background: #00897b; border-color: #00897b; color: #fff; font-weight: 600; }
    .qa-chips::-webkit-scrollbar { display: none; }
    .qa-chip { padding: 7px 13px; border-radius: 9px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; background: #f5f5f5; color: #333; }
    .qa-chip.active { background: #00897b; color: #fff; }
    .qa-input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 15px; outline: none; box-sizing: border-box; margin-bottom: 12px; }
    .qa-input.amount { font-size: 20px; font-weight: 700; }
    .qa-warning { background: #fff8e1; border: 1px solid #ffe082; border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 13px; }
    .qa-btns { display: flex; gap: 10px; }
    .qa-btns button { padding: 14px; border-radius: 12px; font-size: 15px; cursor: pointer; }
    .btn-sync:disabled { background: #aab; }
    .btn-ghost { background: none; border: none; color: #99a; font-size: 13px; cursor: pointer; }
    .btn-icon { background: none; border: none; color: #556; cursor: pointer; padding: 4px; display: flex; align-items: center; }
    /* 設定頁 */
    .settings-head { background: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #e0efeb; position: sticky; top: 0; z-index: 50; }
    .settings-head h1 { font-size: 18px; font-weight: 700; margin: 0; }
    .btn-back { background: none; border: none; color: #556; cursor: pointer; padding: 2px; display: flex; }
    .setting-section { margin: 16px; }
    .setting-section h2 { font-size: 13px; color: #8a9a97; font-weight: 600; margin: 0 0 8px; padding-left: 4px; }
    .setting-card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,60,50,0.06); }
    .setting-item { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f2f2f2; cursor: pointer; }
    .setting-item:first-child { border-top: none; }
    .setting-item .label { font-size: 15px; }
    .setting-item .sub { font-size: 12px; color: #9aa; margin-top: 2px; }
    .setting-item .arrow { color: #ccc; }
    .setting-item.danger .label { color: #c62828; }
    /* 銀行設定子頁 */
    .bank-setting { padding: 16px; }
    .bank-block { background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 4px 16px rgba(0,60,50,0.06); }
    .bank-block-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .bank-block-head .bname { font-weight: 600; font-size: 15px; }
    .bank-block-head .btags { margin-left: auto; display: flex; gap: 4px; }
    .btag { font-size: 10px; padding: 2px 7px; border-radius: 20px; background: #eef5f3; color: #6a8a85; }
    .bank-block .pw-input { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid #dde8e5; font-size: 14px; }
    .bank-block .pw-input:focus { outline: none; border-color: #00897b; }
    .bank-block .pw-label { font-size: 12px; color: #9aa; margin-bottom: 5px; }
    .info-banner { background: #e8f5f3; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; font-size: 13px; color: #456; line-height: 1.7; }
    .info-banner b { color: #00897b; }
    /* 帳單頁 */
    .bill-section-title { font-size: 13px; font-weight: 600; margin: 4px 0 10px; padding-left: 4px; }
    .bill-card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 4px 16px rgba(0,60,50,0.06); margin-bottom: 12px; }
    .bill-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .bill-bank { font-weight: 700; font-size: 16px; }
    .bill-due { font-size: 12px; margin-top: 4px; }
    .bill-amount { font-weight: 700; font-size: 20px; text-align: right; }
    .bill-tag { font-size: 11px; opacity: 0.4; margin-top: 2px; text-align: right; }
    .btn-paid { margin-top: 12px; width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #00897b; background: none; color: #00897b; font-weight: 600; cursor: pointer; font-size: 14px; }
    .paid-row { background: #fff; border-radius: 14px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,60,50,0.04); display: flex; justify-content: space-between; align-items: center; opacity: 0.6; margin-bottom: 10px; }
    .paid-row .pb-bank { font-weight: 600; }
    .paid-row .pb-date { font-size: 12px; opacity: 0.6; }
    .show-more { text-align: center; font-size: 13px; color: #00897b; cursor: pointer; padding: 8px; }
    /* 繳款對話框 */
    .dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 300; padding: 20px; }
    .dialog { background: #fff; border-radius: 18px; padding: 20px; width: 100%; max-width: 340px; }
    .dialog h3 { margin: 0 0 16px; font-size: 17px; }
    .dialog label { font-size: 12px; color: #9aa; display: block; margin-bottom: 6px; }
    .dialog input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #dde8e5; font-size: 15px; margin-bottom: 14px; }
    .dialog-btns { display: flex; gap: 8px; }
    .dialog-btns button { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
    /* 帳戶頁 */
    .total-card { background: linear-gradient(135deg, #00897b, #00bfa5); border-radius: 20px; padding: 20px 24px; margin-bottom: 16px; color: #fff; }
    .total-card .tc-label { font-size: 13px; opacity: 0.85; margin-bottom: 4px; }
    .total-card .tc-amount { font-size: 32px; font-weight: 700; }
    .acct-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,60,50,0.06); margin-bottom: 10px; }
    .acct-head { padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .acct-name { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 10px; }
    .btn-fix { background: #f0f9f7; border: none; border-radius: 6px; padding: 3px 9px; font-size: 11px; color: #00897b; cursor: pointer; }
    .acct-balance { font-weight: 700; font-size: 18px; }
    .acct-edit { padding: 0 16px 16px; display: flex; gap: 8px; }
    .acct-edit input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #dde8e5; font-size: 15px; }
    .acct-edit button { background: #00897b; color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
    .tr-row { padding: 12px 16px; border-top: 1px solid #f2f2f2; display: flex; justify-content: space-between; align-items: center; }
    .tr-meta { font-size: 13px; opacity: 0.5; }
    .tr-amount { font-weight: 600; }
    /* 總覽頁 */
    .cf-year { background: linear-gradient(135deg, #1a2f2e, #00897b); border-radius: 20px; padding: 20px; margin-bottom: 12px; color: #fff; }
    .cf-year .cy-label { font-size: 12px; opacity: 0.6; margin-bottom: 4px; }
    .cf-year .cy-balance { font-size: 28px; font-weight: 700; margin-bottom: 16px; }
    .cf-year .cy-row { display: flex; justify-content: space-between; font-size: 13px; }
    .cf-card { background: #fff; border-radius: 20px; padding: 20px; margin-bottom: 12px; box-shadow: 0 4px 16px rgba(0,60,50,0.06); }
    .cf-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .cf-month { font-weight: 700; font-size: 15px; }
    .cf-balance { font-weight: 700; font-size: 16px; }
    .cf-bar { position: relative; height: 20px; background: #e0e0e0; border-radius: 8px; overflow: visible; }
    .cf-bar-inc { position: absolute; left: 0; top: 0; height: 100%; background: #ef5350; border-radius: 8px; transition: width .6s; }
    .cf-bar-exp { position: absolute; right: 0; top: 0; height: 100%; background: #26a69a; border-radius: 8px; transition: width .6s; }
    .cf-emoji { position: absolute; top: 50%; transform: translate(-50%,-50%); font-size: 1.6rem; line-height: 1; z-index: 10; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3)); transition: left .6s; }
    .cf-legend { display: flex; justify-content: space-between; margin-top: 6px; font-size: 13px; }
    /* 發票匹配台 */
    .inv-stat { font-size: 12px; font-weight: 600; color: #00897b; padding-left: 4px; }
    .inv-card { background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,60,50,0.06); overflow: hidden; margin-bottom: 10px; }
    .inv-card-body { padding: 14px 16px; }
    .inv-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .inv-store { font-weight: 600; font-size: 14px; }
    .inv-meta { font-size: 12px; opacity: 0.5; margin-top: 2px; }
    .inv-amt { font-weight: 700; font-size: 16px; }
    .inv-btns { display: flex; gap: 8px; }
    .inv-btn { flex: 1; padding: 8px; border-radius: 10px; font-size: 13px; cursor: pointer; font-weight: 600; }
    .inv-btn-match { border: 1px solid #00897b; background: none; color: #00897b; }
    .inv-btn-ignore { border: 1px solid #ddd; background: none; color: #aaa; }
    .inv-match-list { border-top: 1px solid #f5f5f5; }
    .inv-match-hint { padding: 10px 16px; font-size: 12px; opacity: 0.5; }
    .inv-exp-row { padding: 12px 16px; border-bottom: 1px solid #f5f5f5; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .inv-exp-row:hover { background: #f9f9f9; }
    .inv-section-toggle { font-size: 13px; font-weight: 600; color: #aaa; margin: 20px 0 10px; padding-left: 4px; cursor: pointer; }
    .inv-matched-row { background: #fff; border-radius: 14px; padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,60,50,0.04); display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    /* content */
    .content { padding: 16px; }
    /* login */
    .login { max-width: 340px; margin: 0 auto; padding: 80px 24px; text-align: center; }
    .login h1 { font-size: 32px; margin: 0 0 8px; }
    .login p { color: #7a8a87; margin: 0 0 32px; }
    .btn-login { background: #00897b; color: #fff; border: none; border-radius: 12px; padding: 14px 28px; font-size: 16px; font-weight: 600; cursor: pointer; }
    /* month group */
    .month-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,60,50,0.06); margin-bottom: 12px; }
    .month-head { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .month-title { font-weight: 600; font-size: 15px; }
    .month-total { font-weight: 700; color: #e5484d; }
    .exp-row { padding: 11px 16px; border-top: 1px solid #f2f2f2; display: flex; justify-content: space-between; align-items: center; }
    .exp-left .exp-meta { font-size: 12px; color: #9aa; }
    .exp-left .exp-bank { font-size: 14px; margin-top: 1px; }
    .exp-amount { font-weight: 600; }
    /* bank tag color dot */
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    /* tabbar */
    .tabbar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: #fff; border-top: 1px solid #e0efeb; display: flex; justify-content: space-around; padding: 8px 0 10px; z-index: 50; }
    .tab { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 12px; color: #aab; font-size: 11px; }
    .tab.active { color: #00897b; font-weight: 700; }
    .tab svg { width: 22px; height: 22px; }
    /* 廣告版位（固定在 tabbar 上方，扁平貼底、不浮動） */
    .ad-banner { position: fixed; bottom: 62px; left: 0; right: 0; max-width: 480px; margin: 0 auto; height: 72px; z-index: 49; display: none; background: #fff; border-top: 1px solid #e5ecea; }
    .ad-banner img { width: 100%; height: 100%; display: block; object-fit: cover; cursor: pointer; }
    .app.has-banner { padding-bottom: 144px; }
    /* status */
    .status { text-align: center; padding: 8px; font-size: 13px; color: #7a8a87; }
    .status.ok { color: #2e7d32; } .status.err { color: #c62828; }
    .empty { text-align: center; padding: 48px 20px; color: #aab; }
    .placeholder { text-align: center; padding: 60px 20px; color: #aab; font-size: 15px; }
    /* 搜尋框 */
    .search-box { position: relative; margin-bottom: 10px; }
    .search-box input { width: 100%; padding: 11px 14px 11px 38px; border-radius: 12px; border: 1px solid #dde8e5; font-size: 14px; background: #fff; }
    .search-box input:focus { outline: none; border-color: #00897b; }
    .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: #9aa; }
    .search-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #bbc; cursor: pointer; font-size: 18px; }
    .sort-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .result-count { font-size: 12px; color: #9aa; }
    .sort-btn { background: none; border: none; color: #7a8a87; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 3px; }
    /* 月份收合 */
    .month-head .caret { color: #bbc; transition: transform .2s; font-size: 13px; margin-left: 6px; }
    .month-card.collapsed .caret { transform: rotate(-90deg); }
    .month-card.collapsed .exp-row { display: none; }
    .month-head-left { display: flex; align-items: center; }
    /* 篩選列 */
    .filter-bar { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 12px; -webkit-overflow-scrolling: touch; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; background: #fff; border: 1px solid #dde8e5; border-radius: 20px; padding: 6px 13px; font-size: 13px; color: #556; cursor: pointer; white-space: nowrap; }
    .chip.active { background: #00897b; color: #fff; border-color: #00897b; font-weight: 600; }
    .sort-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
    .sort-btn { background: none; border: none; color: #7a8a87; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 3px; }
    .sync-panel { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 16px rgba(0,60,50,0.06); }
    .sync-panel .pw-row { margin: 6px 0; display: flex; align-items: center; gap: 8px; }
    .sync-panel label { width: 44px; font-size: 13px; color: #556; }
    .sync-panel input { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #dde; font-size: 14px; }
    .sync-panel .hint { font-size: 12px; color: #9aa; margin: 4px 0 12px; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- 登入畫面 -->
    <div class="login" id="loginView">
      <h1>YouOwn</h1>
      <p>你的財務，只存在你自己的 Google</p>
      <button class="btn-login" id="loginBtn">用 Google 登入</button>
    </div>

    <!-- 主畫面（登入後顯示） -->
    <div id="mainView" style="display:none;">
      <div class="header">
        <h1 id="pageTitle">消費</h1>
        <div class="header-actions">
          <button class="btn-add" id="quickAddBtn">✏️ 記帳</button>
          <button class="btn-sync" id="syncBtn">🔄 同步</button>
          <button class="btn-icon" id="settingsBtn" title="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="22" height="22"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>

    <!-- 底部頁籤（登入後顯示） -->
    <div class="tabbar" id="tabbar" style="display:none;"></div>

    <!-- 廣告版位 -->
    <div class="ad-banner" id="adBanner"><img id="adBannerImg" alt="" /></div>

    <!-- 設定頁（覆蓋，預設隱藏） -->
    <div id="settingsView" style="display:none;">
      <div class="settings-head">
        <button class="btn-back" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <h1>設定</h1>
      </div>
      <div id="settingsContent"></div>
    </div>

    <!-- 銀行設定子頁 -->
    <div id="bankSettingView" style="display:none;">
      <div class="settings-head">
        <button class="btn-back" id="bankBackBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <h1>同步設定</h1>
      </div>
      <div id="bankSettingContent"></div>
    </div>

    <!-- 分類規則子頁 -->
    <div id="categorySettingView" style="display:none;">
      <div class="settings-head">
        <button class="btn-back" id="catBackBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <h1>分類規則</h1>
      </div>
      <div id="categorySettingContent"></div>
    </div>

    <!-- 顯示頁籤子頁 -->
    <div id="tabSettingView" style="display:none;">
      <div class="settings-head">
        <button class="btn-back" id="tabBackBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <h1>顯示頁籤</h1>
      </div>
      <div id="tabSettingContent"></div>

    async function addCategoryRule(keyword, category) {
      await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/categories!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',
        {method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({values:[[keyword,category]]})});
    }
    async function deleteCategoryRule(idx) {
      const meta=await fetchSheetMeta();
      const sheet=meta.sheets.find(s=>s.properties.title==='categories');
      if(!sheet)return;
      const sheetId=sheet.properties.sheetId;
      await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+':batchUpdate',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({requests:[{deleteDimension:{range:{sheetId,dimension:'ROWS',startIndex:idx+1,endIndex:idx+2}}}]})});
    }
    // 依現在的規則，重新套分類到所有發票（只改 G 欄分類）
    async function reapplyCategories() {
      await loadCategoryRules();
      const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/invoices!A2:J100000',{headers:{'Authorization':'Bearer '+accessToken}});
      const data = await res.json();
      const rows = data.values || [];
      const invUpdates = [];
      const matchedForExp = []; // { gmail_id, cat } 已匹配且分類有變的，之後要回頭更新消費
      rows.forEach((r, i) => {
        const store = r[1] || '';
        const cat = categoryForStore(store) || '';
        const status = r[7] || '';
        const matchedExpId = r[8] || '';
        const oldCat = r[6] || '';
        if (oldCat !== cat) invUpdates.push({ range: 'invoices!G'+(i+2), values: [[cat]] });
        if (status === '已匹配' && matchedExpId && cat) matchedForExp.push({ gmail_id: matchedExpId, cat, oldCat });
      });
      if (invUpdates.length) {
        // 分批（一次最多 100 個 range）
        for (let i=0;i<invUpdates.length;i+=100) {
          await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values:batchUpdate',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'RAW',data:invUpdates.slice(i,i+100)})});
        }
      }
      // 回頭把新分類同步寫進已匹配的消費（只在消費仍是「待分類」時才覆蓋，保護用戶手動改過的分類）
      let expUpdatedCount = 0;
      if (matchedForExp.length) {
        const allExp = await loadExpenses();
        const expByGmailId = {};
        allExp.forEach(e => { if (e.gmail_id) expByGmailId[e.gmail_id] = e; });
        const expUpdates = [];
        for (const m of matchedForExp) {
          const exp = expByGmailId[m.gmail_id];
          // 「重新套用」= 用戶明確要求照規則重算 → 已匹配消費直接跟隨發票的新分類（規則優先）
          if (exp && exp.category !== m.cat) {
            expUpdates.push({ range: 'expenses!F'+exp.row, values: [[m.cat]] });
          }
        }
        if (expUpdates.length) {
          for (let i=0;i<expUpdates.length;i+=100) {
            await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values:batchUpdate',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'RAW',data:expUpdates.slice(i,i+100)})});
          }
          expUpdatedCount = expUpdates.length;
        }
      }
      // 刷新快取：發票與消費一起更新，不用等下次同步
      const [freshExp, freshInv] = await Promise.all([loadExpenses(), loadInvoices()]);
      writeCache('expenses', freshExp);
      writeCache('invoices', freshInv);
      expensesData = freshExp;
      invoicesData = freshInv;
      return invUpdates.length + expUpdatedCount;
    }

      const moreBtn = document.getElementById('toggleMoreBanks');
      if (moreBtn) moreBtn.onclick = () => {
        collectBalInputs();
        showMoreBanks = !showMoreBanks;
        renderMyBanksSetting();
      };
      document.querySelectorAll('.mybank-chip').forEach(chip => {
        chip.onclick = () => {
          collectBalInputs();
          const b = chip.dataset.bank;
          const arr = myBanks ? [...myBanks] : [];
          const i = arr.indexOf(b);
          if (i > -1) arr.splice(i, 1); else arr.push(b);
          myBanks = arr;
          renderMyBanksSetting();
        };
      });
      document.getElementById('addCustomBank').onclick = () => {
        collectBalInputs();
        const name = document.getElementById('customBankInput').value.trim();
        if (!name) return;
        const arr = myBanks ? [...myBanks] : [];
        if (!arr.includes(name)) arr.push(name);
        myBanks = arr;
        renderMyBanksSetting();
      };
      document.querySelectorAll('.bank-move-up').forEach(btn => {
        btn.onclick = () => {
          collectBalInputs();
          const i = parseInt(btn.dataset.idx);
          if (i <= 0) return;
          const arr = [...myBanks];
          [arr[i-1], arr[i]] = [arr[i], arr[i-1]];
          myBanks = arr;
          renderMyBanksSetting();
        };
      });
      document.querySelectorAll('.bank-move-down').forEach(btn => {
        btn.onclick = () => {
          collectBalInputs();
          const i = parseInt(btn.dataset.idx);
          if (i >= myBanks.length-1) return;
          const arr = [...myBanks];
          [arr[i], arr[i+1]] = [arr[i+1], arr[i]];
          myBanks = arr;
          renderMyBanksSetting();
        };
      });
      document.getElementById('myBanksDoneBtn').onclick = async () => {
        if (!myBanks || !myBanks.length) { showToast('至少勾選一個（例如 現金）'); return; }
        const btn = document.getElementById('myBanksDoneBtn');
        if (btn.disabled) return; // 避免重複點擊
        const origText = btn.textContent;
        btn.disabled = true; btn.style.opacity = '0.6'; btn.textContent = '儲存中...';
        try {
          // 收集餘額輸入
          const balances = {};
          document.querySelectorAll('.bal-input').forEach(inp => {
            if (inp.value !== '') balances[inp.dataset.bank] = parseFloat(inp.value);
          });
          // 收集顏色輸入
          document.querySelectorAll('.bank-color-input').forEach(inp => {
            bankColors[inp.dataset.bank] = inp.value;
          });
          await saveMyBanks();
          await saveBankColors();
          await upsertAccountBalances(balances, myBanks);
          writeCache('accounts', await loadAccounts());
          // 首次引導：依「需求 × 勾選銀行的能力」自動配同步選項，接著帶去同步設定填密碼
          if (onboardingNeeds) {
            syncOptions = {};
            for (const bankName of myBanks) {
              const cap = BANKS_SUPPORT.find(b => b.name === bankName);
              if (!cap) continue;
              const o = {};
              if (cap.account) o.account = true; // 有帳戶通知就開，讓餘額能自動更新
              if (onboardingNeeds.expense && cap.expense) o.expense = true;
              if (onboardingNeeds.bill && cap.bill) o.bill = true;
              if (Object.keys(o).length) syncOptions[bankName] = o;
            }
            if (onboardingNeeds.invoice) syncOptions['發票'] = { enabled: true };
            await saveSyncOptions();
            onboardingNeeds = null;
            document.getElementById('myBanksView').style.display = 'none';
            showToast('已依你的選擇設定同步項目');
            openBankSetting(); // 帶去同步設定確認 + 填 PDF 密碼
            return;
          }
          document.getElementById('myBanksView').style.display = 'none';
          document.getElementById('settingsView').style.display = 'block';
          showToast('資產設定已儲存');
        } catch (err) {
          showToast('儲存失敗：' + (err && err.message ? err.message : '請檢查網路後再試一次'));
          btn.disabled = false; btn.style.opacity = '1'; btn.textContent = origText;
        }
      };
    }

    // 勾選的帳戶 ensure 進 accounts；有輸入餘額的更新
    async function upsertAccountBalances(balances, bankList) {
      await ensureAccountsSheet();
      const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/accounts!A2:B100000',{headers:{'Authorization':'Bearer '+accessToken}});
      const d = await res.json(); const rows = d.values||[];
      const rowNumMap = {};
      rows.forEach((r,i)=>{ if(r[0]) rowNumMap[r[0]]=i+2; });
      const updates=[]; const appends=[];
      for (const b of bankList) {
        const hasBal = balances[b] !== undefined;
        if (rowNumMap[b]) {
          if (hasBal) updates.push({range:'accounts!B'+rowNumMap[b],values:[[balances[b]]]});
        } else {
          appends.push([b, hasBal ? balances[b] : 0]);
        }
      }
      if(updates.length) await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values:batchUpdate',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'RAW',data:updates})});
      if(appends.length) await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/accounts!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({values:appends})});
    }

    function chipToggle(bank, type, label, active) {
      return '<button class="chip-toggle" data-bank="' + esc(bank) + '" data-type="' + type + '" '
        + 'style="border:1px solid ' + (active?'#00897b':'#dde8e5') + ';background:' + (active?'#00897b':'#fff') + ';'
        + 'color:' + (active?'#fff':'#556') + ';border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;font-weight:' + (active?'600':'400') + ';">'
        + (active?'✓ ':'') + label + '</button>';
    }

    // 存/讀 syncOptions 到 _config
    async function saveSyncOptions() {
      if (!spreadsheetId) return;
      const parts = [];
      for (const [bank, o] of Object.entries(syncOptions)) {
        if (bank === '發票') { if (o.enabled) parts.push('發票:enabled'); continue; }
        const types = Object.keys(o).filter(t => o[t]);
        if (types.length) parts.push(bank + ':' + types.join(','));
      }
      await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + spreadsheetId + '/values/_config!A2:B2?valueInputOption=RAW',
        { method:'PUT', headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'}, body: JSON.stringify({ values: [['sync_options', parts.join(';')]] }) });
    }
    async function loadSyncOptions() {
      if (!spreadsheetId) return;
      try {
        const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + spreadsheetId + '/values/_config!A1:B20',
          { headers: { 'Authorization': 'Bearer ' + accessToken } });
        const data = await res.json();
        const rows = data.values || [];
        const row = rows.find(r => r[0] === 'sync_options');
        syncOptions = {};
        if (row && row[1]) {
          row[1].split(';').forEach(part => {
            const [bank, types] = part.split(':');
            if (bank && types) { syncOptions[bank] = {}; types.split(',').forEach(t => syncOptions[bank][t] = true); }
          });
        } else {
          // 預設：所有支援的都開
          for (const b of BANKS_SUPPORT) {
            syncOptions[b.name] = {};
            if (b.account) syncOptions[b.name].account = true;
            if (b.expense) syncOptions[b.name].expense = true;
            if (b.bill) syncOptions[b.name].bill = true;
          }
          syncOptions['發票'] = { enabled: true };
        }
      } catch(e) { syncOptions = {}; }
    }
    document.getElementById('logoutBtn')?.addEventListener('click', () => location.reload());

    // ===== Sheet =====
    async function ensureSheet() {
      const q = encodeURIComponent("name='" + SHEET_TITLE + "' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false");
      const sd = await (await fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)',
        { headers: { 'Authorization': 'Bearer ' + accessToken } })).json();
      if (sd.files && sd.files.length) { spreadsheetId = sd.files[0].id; return; }
      // 新用戶：建立完整試算表（所有分頁 + 標題列）
      const createRes = await fetch('https://sheets.googleapis.com/v4/spreadsheets', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          properties: { title: SHEET_TITLE },
          sheets: ['expenses','bills','transfers','invoices','accounts','categories','_config'].map(t => ({ properties: { title: t } }))
        })
      });
      const created = await createRes.json();
      if (!created || !created.spreadsheetId) {
        throw new Error('建立帳本失敗（' + (created && created.error && created.error.message ? created.error.message : '請重新登入再試') + '）');
      }
      spreadsheetId = created.spreadsheetId;
      // 寫入各分頁標題列
      await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + spreadsheetId + '/values:batchUpdate', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({ valueInputOption: 'RAW', data: [
          { range: 'expenses!A1:J1', values: [['日期','銀行','金額','備註','gmail_message_id','分類','狀態','發票明細','來源','排除']] },
          { range: 'bills!A1:G1', values: [['銀行','結帳日','繳款截止日','應繳總額','最低應繳','狀態','key']] },
          { range: 'transfers!A1:H1', values: [['日期','銀行','類型','轉出帳號','轉入帳號','金額','gmail_message_id','note']] },
          { range: 'invoices!A1:J1', values: [['日期','店名','金額','發票號碼','載具','統編','分類','狀態','配對消費','明細']] },
          { range: 'accounts!A1:B1', values: [['銀行','餘額']] },
          { range: 'categories!A1:B1', values: [['關鍵字','分類']] }
        ]})
      });
    }

    async function loadExpenses() {
      if (!spreadsheetId) return [];
      const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + spreadsheetId + '/values/expenses!A2:J100000',
        { headers: { 'Authorization': 'Bearer ' + accessToken } });
      const data = await res.json();
      const rows = data.values || [];
      // [日期, 銀行, 金額, 備註, gmail_id, 分類, 狀態, 發票明細, 來源, 排除]
      return rows.map((r, i) => ({
        row: i + 2,
        date: r[0], bank: r[1], amount: parseInt(r[2]||'0',10), note: r[3]||'',
        gmail_id: r[4]||'', category: r[5]||'待分類', status: r[6]||'待匹配',
        invoice_detail: r[7]||'', source: r[8]||'', excluded: (r[9]==='TRUE'||r[9]==='1')
      })).filter(e => e.date && e.bank)
        .sort((a,b) => b.date.localeCompare(a.date));
    }

    async function loadBills() {
      if (!spreadsheetId) return [];
      const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + spreadsheetId + '/values/bills!A2:G100000',
        { headers: { 'Authorization': 'Bearer ' + accessToken } });
      const data = await res.json();
      const rows = data.values || [];
      // [銀行, 結帳日, 繳款截止日, 應繳總額, 最低應繳, 狀態, key]
      return rows.map(r => ({
        bank: r[0], bill_date: r[1], due_date: r[2],
        total_amount: parseInt(r[3]||'0',10), min_payment: parseInt(r[4]||'0',10),
        status: r[5]||'未繳', key: r[6]
      })).filter(b => b.bank && b.key);
    }

    // 日期輔助
    function daysLeft(dueDate) {
      if (!dueDate) return null;
      const due = new Date(dueDate + 'T00:00:00');
      const now = new Date(); now.setHours(0,0,0,0);
      return Math.round((due - now) / 86400000);
    }

    function setContent(html) { document.getElementById('content').innerHTML = html; }
    function fmt(n) { return Number(n||0).toLocaleString('en-US'); }
    // HTML 轉義：所有來自信件內容/用戶輸入的文字進 innerHTML 前必須經過，防 stored XSS
    function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    // toast 提示
    function showToast(msg) {
      let t = document.getElementById('toast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'toast';
        t.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(26,46,43,0.94);color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center;';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.style.opacity = '1';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.opacity = '0'; }, 2200);
    }

    // ===== 消費頁 =====

    function renderExpenses() {

        setContent('<div class="empty">還沒有消費紀錄<br>按右上角「同步」抓取</div>');
        return;
      }
      // 搜尋框（只建一次，之後不重建，避免中文輸入中斷）
      const html = '<div class="search-box">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>'
        + '<input id="searchInput" type="text" placeholder="搜尋銀行、備註、金額、店名、分類" value="' + searchText.replace(/"/g,'&quot;') + '" />'
        + '<button class="search-clear" id="searchClear" style="display:' + (searchText?'block':'none') + '">×</button>'

        renderExpList();

    // 只重繪列表區（搜尋框不動）
    function renderExpList() {
      const clear = document.getElementById('searchClear');
      if (clear) clear.style.display = searchText ? 'block' : 'none';

      let list = expensesData.slice();
      if (expCatFilter) list = list.filter(e => (e.category || '待分類') === expCatFilter);
      const kw = searchText.trim().toLowerCase();
      if (kw) {
        list = list.filter(e =>
          (e.bank && e.bank.toLowerCase().includes(kw)) ||
          (e.note && e.note.toLowerCase().includes(kw)) ||
          String(e.amount).includes(kw) ||
          (e.category && e.category.toLowerCase().includes(kw)) ||
          (e.invoice_detail && e.invoice_detail.toLowerCase().includes(kw))
        );
      }
      if (sortMode === 'amount') list.sort((a,b) => b.amount - a.amount);
      else list.sort((a,b) => b.date.localeCompare(a.date));

      document.getElementById('resultCount').textContent = list.length + ' 筆' + (kw ? '（搜尋「' + searchText + '」）' : '');
      document.getElementById('sortToggle').textContent = (sortMode==='date' ? '↕ 依日期' : '↕ 依金額');

      const listEl = document.getElementById('expList');
      if (!list.length) { listEl.innerHTML = '<div class="empty">找不到符合的消費</div>'; return; }

      const groups = {};
      for (const e of list) { const m = e.date.slice(0,7); (groups[m] = groups[m] || []).push(e); }
      const months = Object.keys(groups).sort((a,b)=>b.localeCompare(a));
      const now = new Date();
      const curMonth = now.getFullYear() + '-' + String
