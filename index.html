          // 記錄扣款開關
          + '<div style="display:flex;justify-content:space-between;align-items:center;background:#f7faf9;border-radius:10px;padding:10px 12px;margin-bottom:12px;">'
          + '<div><div style="font-size:14px;font-weight:600;">記錄扣款</div>'
          + '<div style="font-size:11px;color:#9aa;margin-top:2px;">' + (payState.record ? '記一筆卡費扣繳並扣帳戶餘額' : '只標記已繳，不動帳') + '</div></div>'
          + '<button id="payRecordToggle" style="border:1px solid ' + (payState.record?'#00897b':'#dde8e5') + ';background:' + (payState.record?'#00897b':'#fff') + ';color:' + (payState.record?'#fff':'#556') + ';border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:600;">' + (payState.record?'✓ 開':'關') + '</button></div>'
          // 扣款帳戶
          + (payState.record ? ('<label>扣款帳戶</label><div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;">'
            + banks.map(b => '<button class="pay-bank-chip" data-bank="' + esc(b) + '" style="flex-shrink:0;border:1px solid ' + (payState.deductBank===b?'#00897b':'#dde8e5') + ';background:' + (payState.deductBank===b?'#00897b':'#fff') + ';color:' + (payState.deductBank===b?'#fff':'#556') + ';border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;white-space:nowrap;">' + esc(b) + '</button>').join('')
            + '</div>') : '')
          + '<div class="dialog-btns"><button style="background:#eee;color:#555;" id="payCancel">取消</button>'
          + '<button style="background:#00897b;color:#fff;" id="payConfirm">確認繳款</button></div></div>';

        document.getElementById('payCancel').onclick = () => overlay.remove();
        overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
        document.getElementById('payRecordToggle').onclick = () => { payState.record = !payState.record; renderPayDialog(); };
        overlay.querySelectorAll('.pay-bank-chip').forEach(chip => {
          chip.onclick = () => { payState.deductBank = chip.dataset.bank; renderPayDialog(); };
        });
        document.getElementById('payConfirm').onclick = async () => {
          const payDate = document.getElementById('payDate').value || today;
          const payAmount = parseFloat(document.getElementById('payAmount').value) || bill.total_amount;
          const btn = document.getElementById('payConfirm');
          btn.disabled = true; btn.textContent = '處理中...';
          await markBillPaid(key);
          if (payState.record && payAmount > 0) {
            // 記一筆卡費扣繳（灰色不計入）+ 扣餘額
            await ensureTransfersSheet();
            await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/transfers!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',
              {method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({values:[[payDate,payState.deductBank,'轉出','','',payAmount,'billpay_'+Date.now(),'卡費扣繳 '+bill.bank]]})});
            await applyBalanceDeltas({ [payState.deductBank]: -payAmount });
            writeCache('transfers', await loadAllTransfers());
            writeCache('accounts', await loadAccounts());
          }
          overlay.remove();
          showToast(payState.record ? '已繳款並記錄扣款' : '已標記繳款');
          billsData = await getBillsData(true);
          await loadAndRender();
        };
      }
      renderPayDialog();
    }

    async function markBillPaid(key) { return setBillStatus(key, '已繳'); }
    // 改帳單狀態（F 欄）。只改狀態，不動餘額——標已繳/還原都不涉及扣款（扣款是繳款對話框「記錄扣款」另外處理）
    async function setBillStatus(key, status) {
      const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + spreadsheetId + '/values/bills!A2:G100000',
        { headers: { 'Authorization': 'Bearer ' + accessToken } });
      const data = await res.json();
      const rows = data.values || [];
      let rowNum = -1;
      rows.forEach((r, i) => { if (r[6] === key) rowNum = i + 2; });
      if (rowNum < 0) return;
      await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + spreadsheetId + '/values/bills!F' + rowNum + '?valueInputOption=RAW',
        { method:'PUT', headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'}, body: JSON.stringify({ values: [[status]] }) });
    }

    // ===== 帳戶頁 =====
    async function loadAccounts() {
      if (!spreadsheetId) return [];
      try {
        const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + spreadsheetId + '/values/accounts!A2:B100000',
          { headers: { 'Authorization': 'Bearer ' + accessToken } });
        const data = await res.json();
        return (data.values || []).map(r => ({ bank: r[0], balance: parseFloat(r[1]||'0') })).filter(a => a.bank);
      } catch(e) { return []; }
    }

    async function loadTransfersForBank(bank) {
      const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + spreadsheetId + '/values/transfers!A2:J100000',
        { headers: { 'Authorization': 'Bearer ' + accessToken } });
      const data = await res.json();
      return (data.values || [])
        .map((r,i) => ({ row:i+2, date:r[0], bank:r[1], type:r[2], from:r[3], to:r[4], amount:parseInt(r[5]||'0',10), gmail_id:r[6]||'', note:r[7]||'', hidden:(r[8]==='TRUE'||r[8]==='1'), pair_id:r[9]||'' }))
        .filter(t => t.bank === bank)
        .sort((a,b) => (b.date||'').localeCompare(a.date||''));
    }
    // 是否為手動記錄（gmail_id 以 manual_ 開頭）
    function isManualTransfer(t) { return (t.gmail_id||'').startsWith('manual_'); }
    // 設定某筆轉帳的隱藏狀態（I 欄）。只改標記，不動餘額——錢已在記帳/同步時反映
    async function setTransferHidden(row, hidden) {
      await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/transfers!I'+row+'?valueInputOption=RAW',
        {method:'PUT',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({values:[[hidden?'TRUE':'']]})});
    }

    // ===== 刪除手動轉帳（含互轉成對處理）=====
    // 讀全表（找配對可能在別家帳戶）。回傳帶 row/gmail_id/pair_id 的完整列
    async function loadAllTransfersFull() {
      const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/transfers!A2:J100000',{headers:{'Authorization':'Bearer '+accessToken}});
      const d = await res.json();
      return (d.values||[]).map((r,i)=>({ row:i+2, date:r[0], bank:r[1], type:r[2], amount:parseInt(r[5]||'0',10), gmail_id:r[6]||'', note:r[7]||'', pair_id:r[9]||'' })).filter(t=>t.date);
    }
    // 找某筆的互轉配對對象（pair_id 優先，fallback：手動互轉 _out/_in 前綴、舊事後配對同日同額反向 note 相同）
    function findPairPartner(t, all) {
      if (t.pair_id) return all.find(x => x.row !== t.row && x.pair_id === t.pair_id) || null;
      const gid = t.gmail_id || '';
      const mm = gid.match(/^(manual_\d+)_(out|in)$/);
      if (mm) { const base = mm[1], other = mm[2]==='out'?'in':'out'; return all.find(x => x.gmail_id === base+'_'+other) || null; }
      // 舊事後配對：note 含互轉但無 pair_id、無前綴 → 同日同額、方向相反、note 相同
      if ((t.note||'').includes('互轉')) {
        const wantType = ['轉入','收入'].includes(t.type) ? '轉出' : '轉入';
        return all.find(x => x.row !== t.row && x.date === t.date && Number(x.amount) === Number(t.amount) && x.type === wantType && x.note === t.note) || null;
      }
      return null;
    }
    // 刪除一列
    async function deleteTransferRow(row) {
      const meta = await fetchSheetMeta();
      const sheet = meta.sheets.find(s => s.properties.title === 'transfers');
      if (!sheet) return;
      await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+':batchUpdate',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({requests:[{deleteDimension:{range:{sheetId:sheet.properties.sheetId,dimension:'ROWS',startIndex:row-1,endIndex:row}}}]})});
    }
    // 清除某筆的互轉標記（同步配對筆用：不刪、還原成普通轉帳，重新計入現金流）
    async function clearMutualMark(row) {
      await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values:batchUpdate',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'RAW',data:[
        { range:'transfers!H'+row, values:[['']] },
        { range:'transfers!J'+row, values:[['']] }
      ]})});
    }
    // 一筆轉帳對餘額的影響（刪除時要反向還原）：轉入/收入為 +，轉出/提款/提領為 -
    function transferDelta(t) {
      if (['轉入','收入'].includes(t.type)) return t.amount;
      if (['轉出','提款','提領'].includes(t.type)) return -t.amount;
      return 0;
    }
    // 刪除手動轉帳主流程。t 為 loadTransfersForBank 的一列（含 row/type/pair_id/gmail_id）
    async function deleteTransferFull(t) {
      const all = await loadAllTransfersFull();
      const partner = findPairPartner(t, all);
      // 要刪的列 + 餘額還原（反向 delta）
      const rowsToDelete = [];
      const balanceDeltas = {};
      const addDel = (x) => { rowsToDelete.push(x.row); balanceDeltas[x.bank] = (balanceDeltas[x.bank]||0) - transferDelta(x); };
      addDel(t);
      if (partner) {
        if (isManualTransfer(partner)) {
          // 配對也是手動 → 成對刪，兩邊餘額都還原
          addDel(partner);
        } else {
          // 配對是同步來的 → 不刪（會復活），改清互轉標記變回普通轉帳；它的餘額不動（本來就對）
          await clearMutualMark(partner.row);
        }
      }
      // 套用餘額還原
      await applyBalanceDeltas(balanceDeltas);
      // 刪列：由大到小刪，避免行號位移
      rowsToDelete.sort((a,b)=>b-a);
      for (const r of rowsToDelete) await deleteTransferRow(r);
      writeCache('transfers', await loadAllTransfers());
      writeCache('accounts', await loadAccounts());
      return { deleted: rowsToDelete.length, clearedPartner: partner && !isManualTransfer(partner) };
    }

    function renderAccounts() {
      if (!accountsData.length) {
        setContent('<div class="empty">還沒有帳戶資料<br>到設定勾選「帳戶」並同步</div>');
        return;
      }
      // 依資產設定的順序排列；未在清單中的（例如舊資料）排在後面
      const order = myBanks || [];
      const sorted = [...accountsData].sort((a, b) => {
        let ia = order.indexOf(a.bank); if (ia === -1) ia = 999;
        let ib = order.indexOf(b.bank); if (ib === -1) ib = 999;
        return ia - ib;
      });
      const total = accountsData.reduce((s,a) => s + a.balance, 0);
      let html = '<div class="total-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;">'
        + '<div><div class="tc-label">🔥 總資產</div><div class="tc-amount">$' + fmt(total) + '</div></div>'
        + '<button id="linkTransfersBtn" style="background:rgba(255,255,255,0.2);border:none;border-radius:8px;padding:5px 11px;font-size:11px;color:#fff;font-weight:600;cursor:pointer;flex-shrink:0;">🔗 互轉配對</button>'
        + '</div></div>';

      for (const a of sorted) {
        const neg = a.balance < 0;
        const color = getBankColor(a.bank);
        html += '<div class="acct-card" data-bank="' + esc(a.bank) + '">'
          + '<div class="acct-head" data-bank="' + esc(a.bank) + '">'
          + '<div class="acct-name"><span class="dot" style="background:' + color + ';width:9px;height:9px;"></span>' + esc(a.bank)
          + '<button class="btn-fix" data-bank="' + esc(a.bank) + '">校正</button></div>'
          + '<div class="acct-balance" style="color:' + (neg?'#f44336':'#00897b') + ';">' + (neg?'-':'') + '$' + fmt(Math.abs(a.balance)) + '</div>'
          + '</div>';
        html += '<div class="acct-edit" id="edit_' + esc(a.bank) + '" style="display:none;">'
          + '<input type="number" placeholder="輸入正確餘額" id="bal_' + esc(a.bank) + '" />'
          + '<button data-bank="' + esc(a.bank) + '">確認</button></div>';
        html += '<div class="acct-transfers" id="tr_' + esc(a.bank) + '"></div>';
        html += '</div>';
      }
      setContent(html);

      // 互轉配對入口
      const ltBtn = document.getElementById('linkTransfersBtn');
      if (ltBtn) ltBtn.onclick = () => openLinkTransfers();

      // 校正按鈕
      document.querySelectorAll('.btn-fix').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const bank = btn.dataset.bank;
          const editEl = document.getElementById('edit_' + bank);
          editEl.style.display = editEl.style.display === 'none' ? 'flex' : 'none';
        };
      });
      // 確認校正
      document.querySelectorAll('.acct-edit button').forEach(btn => {
        btn.onclick = async (e) => {
          e.stopPropagation();
          const bank = btn.dataset.bank;
          const val = document.getElementById('bal_' + bank).value;
          if (val === '') return;
          await setAccountBalance(bank, parseFloat(val));
          showToast('已更新 ' + bank + ' 餘額');
          accountsData = await getAccountsData(true);
          renderAccounts();
        };
      });
      // 展開看轉帳
      document.querySelectorAll('.acct-head').forEach(head => {
        head.onclick = async () => {
          const bank = head.dataset.bank;
          const trEl = document.getElementById('tr_' + bank);
          if (trEl.innerHTML) { trEl.innerHTML = ''; return; }
          trEl.innerHTML = '<div class="tr-row" style="opacity:.4;">載入中...</div>';
          await renderBankTransfers(bank, trEl);
        };
      });
    }

    // 渲染某帳戶的轉帳明細（可點開隱藏、已隱藏折疊找回）。狀態存在閉包裡，重繪不影響其他帳戶
    async function renderBankTransfers(bank, trEl) {
      const all = await loadTransfersForBank(bank);
      if (!all.length) { trEl.innerHTML = '<div class="tr-row" style="opacity:.4;justify-content:center;">沒有轉帳記錄</div>'; return; }
      let expandedRow = null;    // 目前點開操作列的那筆 row
      let showAllVisible = false; // 可見清單是否展開全部（預設 5 筆）
      let showHidden = false;     // 是否展開已隱藏區

      function rowHtml(t) {
        const isIn = ['轉入','收入'].includes(t.type);
        const opened = expandedRow === t.row;
        let h = '<div class="tr-row tr-clickable" data-row="' + t.row + '" style="cursor:pointer;' + (t.hidden?'opacity:.45;':'') + '">'
          + '<div class="tr-meta">' + esc(t.date?t.date.slice(5).replace('-','/'):'') + ' · ' + esc(t.type) + (t.note?' · '+esc(t.note):'') + '</div>'
          + '<div class="tr-amount" style="color:' + (isIn?'#00897b':'#f44336') + ';">' + (isIn?'+':'-') + '$' + fmt(t.amount) + '</div></div>';
        if (opened) {
          const manual = isManualTransfer(t);
          const isMutualRow = !!t.pair_id || /^manual_\d+_(out|in)$/.test(t.gmail_id||'') || (t.note||'').includes('互轉');
          h += '<div style="padding:10px 16px 14px;background:#f7faf9;border-bottom:1px solid #f0f0f0;">'
            + '<div style="font-size:11px;color:#9aa;line-height:1.6;margin-bottom:10px;">隱藏不影響帳戶餘額——這筆錢實際已反映在餘額中，只是不在總覽計入、也不顯示在明細。</div>'
            + '<button class="tr-hide-toggle" data-row="' + t.row + '" data-hidden="' + (t.hidden?'1':'0') + '" style="width:100%;padding:9px;border-radius:8px;border:1px solid ' + (t.hidden?'#00897b':'#dde8e5') + ';background:' + (t.hidden?'#00897b':'#fff') + ';color:' + (t.hidden?'#fff':'#556') + ';font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;">' + (t.hidden?'✓ 已隱藏（點此取消）':'隱藏這筆') + '</button>';
          if (manual) {
            h += '<button class="tr-delete" data-row="' + t.row + '" style="width:100%;padding:9px;border-radius:8px;border:1px solid #f44336;background:none;color:#f44336;font-size:13px;font-weight:600;cursor:pointer;">刪除這筆' + (isMutualRow?'（互轉，含配對）':'') + '</button>';
          } else {
            h += '<div style="font-size:11px;color:#bbc;text-align:center;">同步進來的記錄無法刪除，可改用「隱藏」或到帳戶卡「校正」餘額</div>';
          }
          h += '</div>';
        }
        return h;
      }

      function render() {
        const visible = all.filter(t => !t.hidden);
        const hidden = all.filter(t => t.hidden);
        let html = '';
        const shownVisible = showAllVisible ? visible : visible.slice(0,5);
        html += shownVisible.map(rowHtml).join('');
        if (visible.length > 5 && !showAllVisible) {
          html += '<div class="tr-row tr-more" style="justify-content:center;color:#00897b;cursor:pointer;font-size:13px;">顯示更多（' + (visible.length-5) + ' 筆）</div>';
        }
        if (!visible.length) html += '<div class="tr-row" style="opacity:.4;justify-content:center;">沒有顯示中的轉帳</div>';
        if (hidden.length) {
          html += '<div class="tr-row tr-hidden-toggle" style="justify-content:center;color:#aaa;cursor:pointer;font-size:13px;border-top:1px solid #f0f0f0;">' + (showHidden?'收起已隱藏 ▲':'顯示已隱藏（' + hidden.length + '）▼') + '</div>';
          if (showHidden) html += hidden.map(rowHtml).join('');
        }
        trEl.innerHTML = html;

        trEl.querySelectorAll('.tr-clickable').forEach(row => {
          row.onclick = () => { const r = parseInt(row.dataset.row); expandedRow = (expandedRow===r)?null:r; render(); };
        });
        const more = trEl.querySelector('.tr-more');
        if (more) more.onclick = () => { showAllVisible = true; render(); };
        const ht = trEl.querySelector('.tr-hidden-toggle');
        if (ht) ht.onclick = () => { showHidden = !showHidden; render(); };
        trEl.querySelectorAll('.tr-hide-toggle').forEach(btn => {
          btn.onclick = async (e) => {
            e.stopPropagation();
            const r = parseInt(btn.dataset.row);
            const willHide = btn.dataset.hidden !== '1';
            btn.disabled = true; btn.textContent = '處理中...';
            try {
              await setTransferHidden(r, willHide);
              const t = all.find(x => x.row === r); if (t) t.hidden = willHide; // 更新本地
              expandedRow = null;
              writeCache('transfers', await loadAllTransfers()); // 讓總覽同步排除
              render();
              showToast(willHide ? '已隱藏' : '已取消隱藏');
            } catch (err) { showToast('失敗：' + (err && err.message ? err.message : '請再試一次')); btn.disabled=false; }
          };
        });
        trEl.querySelectorAll('.tr-delete').forEach(btn => {
          btn.onclick = async (e) => {
            e.stopPropagation();
            const r = parseInt(btn.dataset.row);
            const t = all.find(x => x.row === r); if (!t) return;
            btn.disabled = true; btn.textContent = '檢查中...';
            let allFull, partner;
            try {
              allFull = await loadAllTransfersFull();
              partner = findPairPartner(t, allFull);
            } catch (err) { showToast('讀取失敗，請再試一次'); btn.disabled=false; btn.textContent='刪除這筆'; return; }
            // 依配對類型給不同確認說明，讓使用者按確認前就知道會發生什麼
            let msg;
            if (partner && isManualTransfer(partner)) {
              msg = '這是一筆互轉，會同時刪除配對的另一筆（' + partner.bank + ' ' + partner.type + '），兩邊餘額都會還原。確定刪除？';
            } else if (partner) {
              msg = '配對的另一筆是同步進來的記錄，無法刪除。刪除這筆後，那筆會轉回一般轉帳（重新計入收支）。確定刪除？';
            } else {
              msg = '確定刪除這筆記錄？餘額會一併還原。';
            }
            if (!confirm(msg)) { btn.disabled=false; render(); return; }
            btn.textContent = '刪除中...';
            try {
              const res = await deleteTransferFull(t);
              accountsData = await getAccountsData(true);
              showToast(res.clearedPartner ? '已刪除，配對的同步記錄已轉回一般轉帳' : '已刪除');
              renderAccounts();
            } catch (err) { showToast('刪除失敗：' + (err && err.message ? err.message : '請再試一次')); btn.disabled=false; btn.textContent='刪除這筆'; }
          };
        });
      }
      render();
    }

    // ===== 互轉配對（事後把「同日期同金額、一轉出一轉入」的兩筆標記成互轉）=====
    // 只改兩筆的 note（寫成「互轉 A→B」），不動餘額——兩筆當初記帳時餘額已各自加減過，再動會重複。
    // note 含「互轉」的轉帳，現金流會自動歸為灰色（見 loadCashflowData 的 isMutual 判斷）。
    async function loadTransfersWithRow() {
      const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/transfers!A2:H100000',{headers:{'Authorization':'Bearer '+accessToken}});
      const d = await res.json();
      return (d.values||[]).map((r,i) => ({ row:i+2, date:r[0], bank:r[1], type:r[2], amount:parseInt(r[5]||'0',10), note:r[7]||'' })).filter(t => t.date);
    }
    function findMutualPairs(transfers) {
      const clean = t => { const n = t.note || ''; return !n.includes('互轉') && !n.includes('卡費') && !n.includes('忽略互轉'); };
      const outs = transfers.filter(t => t.type === '轉出' && clean(t));
      const ins  = transfers.filter(t => t.type === '轉入' && clean(t));
      const usedIn = new Set();
      const pairs = [];
      for (const out of outs) {
        const match = ins.find(i => !usedIn.has(i.row) && i.date === out.date && Number(i.amount) === Number(out.amount));
        if (match) { usedIn.add(match.row); pairs.push({ out, in: match }); }
      }
      return pairs;
    }
    function openLinkTransfers() {
      const overlay = document.createElement('div');
      overlay.className = 'qa-overlay';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
      document.body.appendChild(overlay);
      let pairs = [];
      function shell(inner) {
        return '<div class="qa-panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'
          + '<div style="font-size:17px;font-weight:700;">🔗 互轉配對</div>'
          + '<button id="ltClose" style="background:none;border:none;font-size:14px;color:#aaa;cursor:pointer;">關閉</button></div>'
          + '<div style="font-size:12px;color:#9aa;margin-bottom:14px;line-height:1.6;">把「同一天、同金額、一轉出一轉入」的兩筆，標記為自己帳戶間的互轉。標記後不影響餘額，只會在總覽裡不計入收支。</div>'
          + inner + '</div>';
      }
      function bindClose() { const c = document.getElementById('ltClose'); if (c) c.onclick = () => overlay.remove(); }
      overlay.innerHTML = shell('<div style="text-align:center;opacity:.4;padding:40px;">載入中...</div>');
      bindClose();
      function renderList() {
        if (!pairs.length) { overlay.innerHTML = shell('<div style="text-align:center;opacity:.4;padding:40px;">沒有可配對的互轉 🎉</div>'); bindClose(); return; }
        let inner = '';
        pairs.forEach((p, idx) => {
          inner += '<div style="background:#f7faf9;border-radius:12px;padding:14px 16px;margin-bottom:10px;">'
            + '<div style="font-size:13px;opacity:.5;margin-bottom:6px;">' + esc(p.out.date) + '</div>'
            + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">'
            + '<div style="font-size:14px;"><span class="dot" style="background:' + getBankColor(p.out.bank) + ';"></span>' + esc(p.out.bank) + ' → <span class="dot" style="background:' + getBankColor(p.in.bank) + ';"></span>' + esc(p.in.bank) + '</div>'
            + '<div style="font-weight:700;">$' + fmt(p.out.amount) + '</div></div>'
            + '<div style="display:flex;gap:8px;">'
            + '<button class="lt-confirm" data-idx="' + idx + '" style="flex:1;padding:8px;border-radius:8px;border:none;background:#00897b;color:#fff;font-weight:600;cursor:pointer;font-size:13px;">確認互轉</button>'
            + '<button class="lt-ignore" data-idx="' + idx + '" style="flex:1;padding:8px;border-radius:8px;border:1px solid #ddd;background:none;color:#aaa;cursor:pointer;font-size:13px;">忽略</button>'
            + '</div></div>';
        });
        overlay.innerHTML = shell(inner);
        bindClose();
        overlay.querySelectorAll('.lt-confirm').forEach(btn => btn.onclick = () => confirmPair(parseInt(btn.dataset.idx), btn));
        overlay.querySelectorAll('.lt-ignore').forEach(btn => btn.onclick = () => ignorePair(parseInt(btn.dataset.idx), btn));
      }
      async function confirmPair(idx, btn) {
        const p = pairs[idx];
        btn.disabled = true; btn.textContent = '處理中...';
        try {
          const note = '互轉 ' + p.out.bank + '→' + p.in.bank;
          const pairId = 'pair_' + Date.now();
          // note（H）標示互轉讓現金流歸灰；pair_id（J）建立硬關聯，供刪除時可靠成對處理
          await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values:batchUpdate',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'RAW',data:[
            { range:'transfers!H'+p.out.row, values:[[note]] },
            { range:'transfers!J'+p.out.row, values:[[pairId]] },
            { range:'transfers!H'+p.in.row,  values:[[note]] },
            { range:'transfers!J'+p.in.row,  values:[[pairId]] }
          ]})});
          pairs.splice(idx, 1);
          writeCache('transfers', await loadAllTransfers());
          renderList();
        } catch (err) { showToast('失敗：' + (err && err.message ? err.message : '請再試一次')); btn.disabled = false; btn.textContent = '確認互轉'; }
      }
      async function ignorePair(idx, btn) {
        const p = pairs[idx];
        btn.disabled = true;
        try {
          await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/transfers!H'+p.out.row+'?valueInputOption=RAW',{method:'PUT',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({values:[['忽略互轉']]})});
          pairs.splice(idx, 1);
          writeCache('transfers', await loadAllTransfers());
          renderList();
        } catch (err) { showToast('失敗：' + (err && err.message ? err.message : '請再試一次')); btn.disabled = false; }
      }
      loadTransfersWithRow().then(ts => { pairs = findMutualPairs(ts); renderList(); })
        .catch(() => { overlay.innerHTML = shell('<div style="text-align:center;opacity:.4;padding:40px;">載入失敗，請關閉後再試</div>'); bindClose(); });
    }

    async function setAccountBalance(bank, balance) {
      const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + spreadsheetId + '/values/accounts!A2:B100000',
        { headers: { 'Authorization': 'Bearer ' + accessToken } });
      const data = await res.json();
      const rows = data.values || [];
      let rowNum = -1;
      rows.forEach((r,i) => { if (r[0] === bank) rowNum = i + 2; });
      if (rowNum < 0) return;
      await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + spreadsheetId + '/values/accounts!B' + rowNum + '?valueInputOption=RAW',
        { method:'PUT', headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'}, body: JSON.stringify({ values: [[balance]] }) });
    }

    // ===== 總覽頁 =====
    let cashflowData = [];
    let expandedCfMonth = null;
    let cfActiveTab = 'expense'; // income | expense
    let expandedCfGroup = null;  // 展開的大分類 key: 'month|groupName'
    async function loadCashflowData() {
      const [exp, tr] = await Promise.all([getExpensesData(), getTransfersData()]);
      const months = {};
      const ensure = m => (months[m] = months[m] || { income:0, expense:0, groups:{} });
      // 大分類容器：{ name, total, gray, side, items:[] }
      const addToGroup = (mm, side, name, gray, item) => {
        const g = mm.groups[side+'|'+name] = mm.groups[side+'|'+name] || { name, side, gray, total:0, items:[] };
        g.total += item.amount; g.items.push(item);
        if (!gray) { if(side==='income') mm.income+=item.amount; else mm.expense+=item.amount; }
      };
      // 消費 → 支出「消費」大分類（計入），並記分類統計
      for (const e of exp) {
        if(!e.date) continue;
        if (e.excluded) continue; // 排除的不計入
        const mm = ensure(e.date.slice(0,7));
        const store = e.invoice_detail ? shortStore(e.invoice_detail.split('/')[0]) : (e.note||'');
        addToGroup(mm, 'expense', '消費', false, { date:e.date, label:e.bank+(store?' · '+store:''), amount:e.amount, category:e.category||'待分類' });
      }
      // 轉帳 → 依 type + note 分大類
      for (const t of tr) {
        if (!t.date) continue;
        if (t.hidden) continue; // 已隱藏：不計入總覽、也不列在明細（餘額不受影響，已在記帳/同步時反映）
        const mm = ensure(t.date.slice(0,7));
        const label = t.bank + ' · ' + (t.note || t.type);
        const item = { date:t.date, label, amount:t.amount };
        const isMutual = t.note && t.note.includes('互轉');
        const isCardPay = t.note && t.note.includes('卡費');
        if (isMutual) {
          // 互轉 → 灰色（收入側或支出側各歸一組）
          if (['轉入','收入'].includes(t.type)) addToGroup(mm, 'income', '互轉', true, item);
          else addToGroup(mm, 'expense', '互轉', true, item);
        } else if (isCardPay) {
          addToGroup(mm, 'expense', '卡費扣繳', true, item);
        } else if (['轉入','收入'].includes(t.type)) {
          addToGroup(mm, 'income', t.type==='收入'?'收入':'轉入', false, item);
        } else if (t.type === '轉出') {
          addToGroup(mm, 'expense', '轉出', false, item);
        } else if (['提領','提款'].includes(t.type)) {
          addToGroup(mm, 'expense', t.type, true, item);
        }
      }
      cashflowData = Object.keys(months).sort((a,b)=>b.localeCompare(a)).map(m => {
        const groups = Object.values(months[m].groups);
        // 消費大分類加上分類統計
        const consumeGroup = groups.find(g => g.side==='expense' && g.name==='消費');
        if (consumeGroup) {
          const catTotals = {};
          for (const it of consumeGroup.items) { const c = it.category||'待分類'; catTotals[c] = (catTotals[c]||0) + it.amount; }
          consumeGroup.categoryTotals = catTotals;
        }
        return {
          key: m, income: months[m].income, expense: months[m].expense,
          balance: months[m].income - months[m].expense, groups
        };
      });
    }

    async function getTransfersData(forceReload) {
      if (!forceReload) { const c = readCache('transfers'); if (c) return c; }
      const d = await loadAllTransfers(); writeCache('transfers', d); return d;
    }
    // 同步後重讀全部並更新快取
    async function refreshAllCache() {
      const [e,b,a,i,t] = await Promise.all([loadExpenses(), loadBills(), loadAccounts(), loadInvoices(), loadAllTransfers()]);
      writeCache('expenses', e); writeCache('bills', b); writeCache('accounts', a); writeCache('invoices', i); writeCache('transfers', t);
    }
    async function loadAllTransfers() {
      if (!spreadsheetId) return [];
      try {
        const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + spreadsheetId + '/values/transfers!A2:I100000',
          { headers: { 'Authorization': 'Bearer ' + accessToken } });
        const data = await res.json();
        return (data.values || []).map(r => ({ date:r[0], bank:r[1], type:r[2], amount:parseInt(r[5]||'0',10), note:r[7]||'', hidden:(r[8]==='TRUE'||r[8]==='1') })).filter(t => t.date);
      } catch(e) { return []; }
    }

    let cfYear = null; // 年度卡目前顯示的年份（null=今年），點卡片在有資料的年份間循環
    function renderCashflow() {
      if (!cashflowData.length) {
        setContent('<div class="empty">還沒有收支資料<br>按右上角「同步」抓取</div>');
        return;
      }
      const now = new Date();
      const curMonth = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
      let html = '';
      // ---- 年度卡（‹ › 箭頭切換年度） ----
      const years = [...new Set(cashflowData.map(m => m.key.slice(0,4)))].sort((a,b)=>b.localeCompare(a)); // 新→舊
      const curY = cfYear || String(now.getFullYear());
      const yi = years.indexOf(curY);
      const olderY = (yi > -1 && yi < years.length-1) ? years[yi+1] : (yi === -1 && years.length ? years[0] : null); // 更早的年份
      const newerY = yi > 0 ? years[yi-1] : null; // 更新的年份
      const yMonths = cashflowData.filter(m => m.key.startsWith(curY));
      const yIncome = yMonths.reduce((s,m)=>s+m.income,0);
      const yExpense = yMonths.reduce((s,m)=>s+m.expense,0);
      const yBal = yIncome - yExpense;
      // 收入/支出文字顏色沿用偏好設定，調亮以便在深色卡上可讀
      const lighten = (hex, amt) => {
        const n = parseInt(hex.slice(1), 16);
        const r = Math.min(255, (n>>16) + amt), g = Math.min(255, ((n>>8)&255) + amt), b = Math.min(255, (n&255) + amt);
        return 'rgb(' + r + ',' + g + ',' + b + ')';
      };
      const yIncColor = lighten(prefs.incColor, 70), yExpColor = lighten(prefs.expColor, 70);
      const arrowStyle = (on) => 'background:none;border:none;color:#fff;font-size:15px;padding:0 6px;line-height:1;cursor:' + (on?'pointer':'default') + ';opacity:' + (on?'0.9':'0.25') + ';';
      html += '<div style="background:linear-gradient(135deg,#1a2f2e,#00897b);border-radius:20px;padding:20px;margin-bottom:12px;color:#fff;">'
        + '<div style="display:flex;align-items:center;gap:2px;margin-bottom:4px;">'
        + '<div style="font-size:12px;opacity:.6;">📅 ' + curY + '年度</div>'
        + '<button id="yearPrev" ' + (olderY?'':'disabled') + ' style="' + arrowStyle(!!olderY) + '">‹</button>'
        + '<button id="yearNext" ' + (newerY?'':'disabled') + ' style="' + arrowStyle(!!newerY) + '">›</button>'
        + '</div>'
        + '<div style="font-size:28px;font-weight:700;margin-bottom:16px;">' + (yBal>=0?'+':'-') + '$' + fmt(Math.abs(yBal)) + '</div>'
        + '<div style="display:flex;justify-content:space-between;font-size:13px;">'
        + '<div><div style="opacity:.6;margin-bottom:2px;">收入</div><div style="font-weight:700;color:' + yIncColor + ';">+' + fmt(yIncome) + '</div></div>'
        + '<div style="text-align:right;"><div style="opacity:.6;margin-bottom:2px;">支出</div><div style="font-weight:700;color:' + yExpColor + ';">-' + fmt(yExpense) + '</div></div>'
        + '</div></div>';
      cashflowData.forEach((m) => {
        const max = Math.max(m.income, m.expense, 1);
        const incPct = (m.income / max) * 100;
        const expPct = (m.expense / max) * 100;
        const ratio = m.income > 0 ? (m.expense / m.income) * 100 : 100;
        const emoji = ratio > prefs.thresholdHigh ? prefs.emojiHigh : ratio < prefs.thresholdLow ? prefs.emojiLow : prefs.emojiMid;
        const label = m.key.slice(0,4) + '年' + parseInt(m.key.slice(5)) + '月';
        const expanded = expandedCfMonth === m.key;
        html += '<div class="cf-card">'
          + '<div class="cf-card-head cf-toggle" data-month="' + m.key + '" style="cursor:pointer;"><div class="cf-month">' + (m.key===curMonth?'🟢 ':'') + label + ' <span style="color:#bbc;font-size:12px;">' + (expanded?'▲':'▼') + '</span></div>'
          + '<div class="cf-balance" style="color:' + (m.balance>=0?'#00897b':'#f44336') + ';">' + (m.balance>=0?'+':'') + '$' + fmt(m.balance) + '</div></div>'
          + '<div class="cf-bar"><div class="cf-bar-inc" style="width:' + incPct + '%;background:' + prefs.incColor + ';"></div>'
          + '<div class="cf-bar-exp" style="width:' + expPct + '%;background:' + prefs.expColor + ';"></div>'
          + '<div class="cf-emoji" style="left:' + (100-expPct) + '%;">' + emoji + '</div></div>'
          + '<div class="cf-legend"><div style="color:' + prefs.incColor + ';font-weight:600;">收入 +' + fmt(m.income) + '</div>'
          + '<div style="color:' + prefs.expColor + ';font-weight:600;">支出 -' + fmt(m.expense) + '</div></div>';

        if (expanded) {
          html += '<div style="margin-top:14px;border-top:1px solid #f0f0f0;padding-top:12px;">';
          // 收入/支出分頁切換
          html += '<div style="display:flex;gap:8px;margin-bottom:12px;">'
            + '<button class="cf-tab" data-tab="income" style="flex:1;padding:8px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:' + (cfActiveTab==='income'?prefs.incColor:'#f5f5f5') + ';color:' + (cfActiveTab==='income'?'#fff':'#333') + ';">收入 +' + fmt(m.income) + '</button>'
            + '<button class="cf-tab" data-tab="expense" style="flex:1;padding:8px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:' + (cfActiveTab==='expense'?prefs.expColor:'#f5f5f5') + ';color:' + (cfActiveTab==='expense'?'#fff':'#333') + ';">支出 -' + fmt(m.expense) + '</button>'
            + '</div>';
          // 該分頁的大分類
          const groups = m.groups.filter(g => g.side === cfActiveTab);
          if (!groups.length) html += '<div style="text-align:center;opacity:.4;font-size:13px;padding:8px;">沒有記錄</div>';
          const sign = cfActiveTab==='income' ? '+' : '-';
          const color = cfActiveTab==='income' ? prefs.incColor : prefs.expColor;
          for (const g of groups) {
            const gkey = m.key + '|' + g.side + '|' + g.name;
            const gExpanded = expandedCfGroup === gkey;
            html += '<div class="cf-group" data-gkey="' + esc(gkey) + '" style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5;cursor:pointer;">'
              + '<div style="font-size:14px;font-weight:600;' + (g.gray?'opacity:.4;':'') + '">' + esc(g.name) + '</div>'
              + '<div style="display:flex;align-items:center;gap:6px;"><span style="font-size:14px;font-weight:600;color:' + (g.gray?'#999':color) + ';">' + sign + fmt(g.total) + '</span>'
              + '<span style="font-size:11px;opacity:.4;">' + (gExpanded?'▲':'▼') + '</span></div></div>';
            if (gExpanded) {
              // 消費大分類 → 顯示分類統計（#飲食 #生活...）
              if (g.name === '消費' && g.categoryTotals) {
                Object.entries(g.categoryTotals).sort((a,b)=>b[1]-a[1]).forEach(([cat, total]) => {
                  html += '<div style="display:flex;justify-content:space-between;padding:4px 0 4px 12px;font-size:12px;border-bottom:1px solid #f8f8f8;">'
                    + '<span style="color:#888;">#' + esc(cat) + '</span>'
                    + '<span style="font-weight:600;color:' + color + ';">' + sign + fmt(total) + '</span></div>';
                });
              } else {
                g.items.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(it => {
                  html += '<div style="display:flex;justify-content:space-between;padding:4px 0 4px 12px;font-size:12px;border-bottom:1px solid #f8f8f8;' + (g.gray?'opacity:.4;':'') + '">'
                    + '<span style="opacity:.5;">' + it.date.slice(5).replace('-','/') + '</span>'
                    + '<span style="flex:1;padding-left:8px;">' + esc(it.label) + '</span>'
                    + '<span style="font-weight:600;color:' + (g.gray?'#999':color) + ';">' + sign + fmt(it.amount) + '</span></div>';
                });
              }
            }
          }
          html += '</div>';
        }
        html += '</div>';
      });
      setContent(html);

      // 年度卡 ‹ › 箭頭切換年度
      const yPrev = document.getElementById('yearPrev');
      const yNext = document.getElementById('yearNext');
      if (yPrev && olderY) yPrev.onclick = () => { cfYear = olderY; renderCashflow(); };
      if (yNext && newerY) yNext.onclick = () => { cfYear = newerY; renderCashflow(); };
      document.querySelectorAll('.cf-toggle').forEach(head => {
        head.onclick = () => { const mm = head.dataset.month; expandedCfMonth = (expandedCfMonth===mm)?null:mm; renderCashflow(); };
      });
      document.querySelectorAll('.cf-tab').forEach(btn => {
        btn.onclick = (e) => { e.stopPropagation(); cfActiveTab = btn.dataset.tab; renderCashflow(); };
      });
      document.querySelectorAll('.cf-group').forEach(g => {
        g.onclick = (e) => { e.stopPropagation(); const k = g.dataset.gkey; expandedCfGroup = (expandedCfGroup===k)?null:k; renderCashflow(); };
      });
    }

    // ===== 發票頁 =====
    async function loadInvoices() {
      if (!spreadsheetId) return [];
      try {
        const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + spreadsheetId + '/values/invoices!A2:J100000',
          { headers: { 'Authorization': 'Bearer ' + accessToken } });
        const data = await res.json();
        return (data.values || []).map((r, i) => ({
          row: i + 2,
          date:r[0], store:r[1], amount:parseInt(r[2]||'0',10),
          invoice_no:r[3], carrier:r[4], tax_id:r[5], category:r[6]||'',
          status:r[7]||'未匹配', matched_expense:r[8]||'', detail:r[9]||''
        })).filter(iv => iv.date && iv.invoice_no)
          .sort((a,b) => (b.date||'').localeCompare(a.date||''));
      } catch(e) { return []; }
    }

    // 店名簡化（取關鍵字，去掉「股份有限公司...分公司」）
    function shortStore(name) {
      if (!name) return '(未知)';
      return name.replace(/股份有限公司.*$/,'').replace(/有限公司.*$/,'').replace(/分公司.*$/,'').trim() || name;
    }

    let invShowMatched = false, invShowIgnored = false, invShowUnmatched = true, invExpandedId = null, invNearbyExp = [];
    function renderInvoices() {
      if (!invoicesData.length) {
        setContent('<div class="empty">還沒有發票<br>到設定啟用「電子發票」並同步<br>或匯入從財政部平台下載的發票 CSV<br><br><button id="importInvBtn" style="background:none;border:1px solid #00897b;color:#00897b;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;">匯入發票 CSV</button></div>');
        const eb = document.getElementById('importInvBtn');
        if (eb) eb.onclick = () => pickInvoiceCsv(eb);
        return;
      }
      const catMatch = (i) => !invCatFilter || (i.category || '待分類') === invCatFilter;
      const unmatched = invoicesData.filter(i => i.status === '未匹配' && catMatch(i));
      const matched = invoicesData.filter(i => i.status === '已匹配' && catMatch(i));
      const ignored = invoicesData.filter(i => i.status === '忽略' && catMatch(i));

      let html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'
        + '<div class="inv-stat">未匹配（' + unmatched.length + '）· 已匹配（' + matched.length + '）· 忽略（' + ignored.length + '）</div>'
        + '<div style="display:flex;gap:6px;flex-shrink:0;">'
        + '<button id="importInvBtn" style="background:none;border:1px solid #00897b;color:#00897b;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;">匯入</button>'
        + '<button id="rematchBtn" style="background:none;border:1px solid #00897b;color:#00897b;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;">重新匹配</button></div></div>';
      // 分類篩選標籤列
      const invCats = ['', ...allCategories()];
      html += '<div class="cat-filter-row">' + invCats.map(c =>
        '<button class="cat-chip inv-cat-chip' + (invCatFilter === c ? ' active' : '') + '" data-cat="' + esc(c) + '">' + (c === '' ? '全部' : esc(c)) + '</button>'
      ).join('') + '<button class="cat-chip" id="invAddCatChip" style="color:#00897b;border-color:#00897b;border-style:dashed;">＋ 分類</button></div>';

      // 未匹配區（收合，跟已匹配/忽略同款；預設展開）
      html += '<div class="inv-section-toggle" id="toggleUnmatched">未匹配（' + unmatched.length + '）' + (invShowUnmatched?'▲':'▼') + '</div>';
      if (invShowUnmatched && unmatched.length) {
        for (const iv of unmatched) {
          const expanded = invExpandedId === iv.invoice_no;
          const cat = iv.category ? ('<span style="font-size:11px;color:#00897b;background:#e8f5f3;padding:1px 7px;border-radius:10px;margin-left:6px;">'+esc(iv.category)+'</span>') : '';
          html += '<div class="inv-card"><div class="inv-card-body">'
            + '<div class="inv-top"><div><div class="inv-store inv-rule-trigger" data-store="' + esc(iv.store) + '" data-inv="' + esc(iv.invoice_no) + '" style="cursor:pointer;">' + esc(shortStore(iv.store)) + cat + (iv.category ? '' : ' <span style="font-size:10px;opacity:.35;">➕規則</span>') + '</div>'
            + '<div class="inv-meta">' + esc(iv.date.slice(5).replace('-','/')) + ' · ' + esc(iv.invoice_no) + '</div></div>'
            + '<div class="inv-amt">$' + fmt(iv.amount) + '</div></div>'
            + '<div class="inv-btns"><button class="inv-btn inv-btn-match" data-inv="' + esc(iv.invoice_no) + '">' + (expanded?'收起':'手動匹配') + '</button>'
            + '<button class="inv-btn inv-btn-ignore" data-ignore="' + esc(iv.invoice_no) + '">忽略</button></div></div>';
          if (expanded) {
            html += '<div class="inv-match-list"><div class="inv-match-hint">選擇對應的消費（前後 7 天）</div><div id="nearbyExp_' + esc(iv.invoice_no) + '"></div></div>';
          }
          html += '</div>';
        }
      } else if (invShowUnmatched) {
        html += '<div style="text-align:center;opacity:.4;padding:40px;">沒有未匹配發票 🎉</div>';
      }

      // 已匹配區（收合）
      html += '<div class="inv-section-toggle" id="toggleMatched">已匹配（' + matched.length + '）' + (invShowMatched?'▲':'▼') + '</div>';
      if (invShowMatched) {
        for (const iv of matched) {
          html += '<div class="inv-matched-row"><div><div class="inv-rule-trigger" data-store="' + esc(iv.store) + '" data-inv="' + esc(iv.invoice_no) + '" style="font-weight:600;font-size:13px;cursor:pointer;">' + esc(shortStore(iv.store)) + '</div>'
            + '<div style="font-size:11px;opacity:.5;">' + esc(iv.date.slice(5).replace('-','/')) + ' · ' + esc(iv.invoice_no) + '</div>'
            + (iv.category?'<div style="font-size:11px;color:#00897b;margin-top:2px;">#' + esc(iv.category) + '</div>':'') + '</div>'
            + '<div style="display:flex;align-items:center;gap:10px;"><div style="font-weight:600;">$' + fmt(iv.amount) + '</div>'
            + '<button class="inv-rematch" data-inv="' + esc(iv.invoice_no) + '" style="padding:4px 10px;border-radius:8px;border:1px solid #ddd;background:none;color:#aaa;font-size:11px;cursor:pointer;white-space:nowrap;">重新配對</button></div></div>';
        }
      }

      // 忽略區（收合）
      html += '<div class="inv-section-toggle" id="toggleIgnored">已忽略（' + ignored.length + '）' + (invShowIgnored?'▲':'▼') + '</div>';
      if (invShowIgnored) {
        for (const iv of ignored) {
          html += '<div class="inv-matched-row" style="opacity:.6;"><div><div style="font-weight:600;font-size:13px;">' + esc(shortStore(iv.store)) + '</div>'
            + '<div style="font-size:11px;opacity:.5;">' + iv.date.slice(5).replace('-','/') + '</div></div>'
            + '<div style="display:flex;align-items:center;gap:10px;"><div style="font-weight:600;">$' + fmt(iv.amount) + '</div>'
            + '<button class="inv-restore" data-inv="' + esc(iv.invoice_no) + '" style="padding:4px 10px;border-radius:8px;border:1px solid #ddd;background:none;color:#aaa;font-size:11px;cursor:pointer;">還原</button></div></div>';
        }
      }

      setContent(html);
      bindInvoiceEvents();
      // 若有展開的，載入附近消費
      if (invExpandedId) loadNearbyExpenses(invExpandedId);
    }

    // 重新匹配：未匹配發票 × 未匹配消費 補配一輪（規則同同步：金額+日期一致，一筆消費只配一次）
    async function rematchInvoices() {
      const [allInv, allExp] = await Promise.all([loadInvoices(), loadExpenses()]);
      const unmatchedInv = allInv.filter(i => i.status === '未匹配');
      const availExp = allExp.filter(e => e.status !== '已匹配');
      const updates = [];
      let count = 0;
      for (const inv of unmatchedInv) {
        const mi = availExp.findIndex(e => Number(e.amount) === Number(inv.amount) && e.date === inv.date);
        if (mi === -1) continue;
        const match = availExp.splice(mi, 1)[0];
        const cat = categoryForStore(inv.store) || inv.category || '';
        // 發票：狀態+配對消費（H、I 欄）
        updates.push({ range: 'invoices!H'+inv.row+':I'+inv.row, values: [['已匹配', match.gmail_id]] });
        // 消費：分類（僅在待分類且有規則分類時套）+狀態+明細（F、G、H 欄）
        const newCat = (cat && match.category === '待分類') ? cat : match.category;
        updates.push({ range: 'expenses!F'+match.row+':H'+match.row, values: [[newCat, '已匹配', inv.detail]] });
        count++;
      }
      if (updates.length) {
        for (let i=0;i<updates.length;i+=100) {
          await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values:batchUpdate',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'RAW',data:updates.slice(i,i+100)})});
        }
        // 刷新快取與記憶體，馬上生效
        const [freshExp, freshInv] = await Promise.all([loadExpenses(), loadInvoices()]);
        writeCache('expenses', freshExp); writeCache('invoices', freshInv);
        expensesData = freshExp; invoicesData = freshInv;
      }
      return count;
    }
    // 從發票店名快速建立分類規則：預帶短店名（可改），建完直接套用到該發票（及其已匹配消費）
    function showAddRulePanel(fullStore, invoiceNo) {
      const overlay = document.createElement('div');
      overlay.className = 'qa-overlay';
      const existingCats = allCategories().filter(c => c !== SYSTEM_CATEGORY);
      overlay.innerHTML = '<div class="qa-panel"><div class="qa-title">新增分類規則</div>'
        + '<div style="font-size:12px;color:#9aa;margin-bottom:14px;word-break:break-all;">' + esc(fullStore) + '</div>'
        + '<div class="qa-label">店家關鍵字（可縮短讓規則更通用）</div>'
        + '<input type="text" class="qa-input" id="ruleKw" value="' + esc(shortStore(fullStore)) + '" />'
        + '<div class="qa-label">分類</div>'
        + '<input type="text" class="qa-input" id="ruleCat" placeholder="輸入分類名稱，如 超商" />'
        + (existingCats.length ? '<div class="qa-chips" style="margin-top:2px;">' + existingCats.map(c => '<button class="qa-chip rule-cat-chip" data-cat="' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div>' : '')
        + '<div class="qa-btns" style="margin-top:14px;"><button id="ruleCancel" style="flex:1;border:1px solid #ddd;background:none;">取消</button>'
        + '<button id="ruleSave" style="flex:2;border:none;background:#00897b;color:#fff;font-weight:600;">新增規則並套用</button></div>'
        + '</div>';
      document.body.appendChild(overlay);
      overlay.querySelectorAll('.rule-cat-chip').forEach(chip => {
        chip.onclick = () => { document.getElementById('ruleCat').value = chip.dataset.cat; };
      });
      document.getElementById('ruleCancel').onclick = () => overlay.remove();
      document.getElementById('ruleSave').onclick = async () => {
        const kw = document.getElementById('ruleKw').value.trim();
        const catName = document.getElementById('ruleCat').value.trim();
        if (!kw || !catName) { showToast('請填關鍵字和分類'); return; }
        const btn = document.getElementById('ruleSave');
        btn.disabled = true; btn.textContent = '儲存中...';
        try {
          await addCategoryRule(kw, catName);
          await loadCategoryRules();
          // 直接套用到這張發票 + 其已匹配的消費
          const allInv = await loadInvoices();
          const inv = allInv.find(i => i.invoice_no === invoiceNo);
          if (inv) {
            const cat = categoryForStore(inv.store) || '';
            const updates = [];
            if (cat && inv.category !== cat) updates.push({ range: 'invoices!G'+inv.row, values: [[cat]] });
            if (cat && inv.status === '已匹配' && inv.matched_expense) {
              const allExp = await loadExpenses();
              const exp = allExp.find(e => e.gmail_id === inv.matched_expense);
              if (exp && exp.category !== cat) updates.push({ range: 'expenses!F'+exp.row, values: [[cat]] });
            }
            if (updates.length) {
              await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values:batchUpdate',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'RAW',data:updates})});
              const [freshExp, freshInv] = await Promise.all([loadExpenses(), loadInvoices()]);
              writeCache('expenses', freshExp); writeCache('invoices', freshInv);
              expensesData = freshExp; invoicesData = freshInv;
            }
          }
          overlay.remove();
          showToast('已套用分類至此筆發票。其他同店名發票欲套用，請至「設定 → 分類規則」按重新套用');
          renderInvoices();
        } catch (err) {
          showToast('失敗：' + (err && err.message ? err.message : '請再試一次'));
          btn.disabled = false; btn.textContent = '新增規則並套用';
        }
      };
    }
    function bindInvoiceEvents() {
      document.querySelectorAll('.inv-rule-trigger').forEach(el => {
        el.onclick = (ev) => { ev.stopPropagation(); showAddRulePanel(el.dataset.store, el.dataset.inv); };
      });
      const impBtn = document.getElementById('importInvBtn');
      if (impBtn) impBtn.onclick = () => pickInvoiceCsv(impBtn);
      const rmBtn = document.getElementById('rematchBtn');
      if (rmBtn) rmBtn.onclick = async () => {
        rmBtn.disabled = true; rmBtn.textContent = '匹配中...';
        try {
          const n = await rematchInvoices();
          showToast(n ? ('補配成功 ' + n + ' 筆') : '沒有可補配的組合');
          renderInvoices();
        } catch (err) {
          showToast('匹配失敗：' + (err && err.message ? err.message : '請再試一次'));
          rmBtn.disabled = false; rmBtn.textContent = '重新匹配';
        }
      };
      const addChip = document.getElementById('invAddCatChip');
      if (addChip) addChip.onclick = () => { openSettings(); openCategorySetting(); };
      document.querySelectorAll('.inv-cat-chip').forEach(chip => {

          invCatFilter = (invCatFilter === chip.dataset.cat) ? '' : chip.dataset.cat;

        };
      });
      document.querySelectorAll('.inv-btn-match').forEach(btn => {
        btn.onclick = () => {
          const no = btn.dataset.inv;
          invExpandedId = (invExpandedId === no) ? null : no;
          renderInvoices();
        };
      });
      document.querySelectorAll('[data-ignore]').forEach(btn => {
        btn.onclick = async () => { await setInvoiceStatus(btn.dataset.ignore, '忽略'); showToast('已忽略'); invoicesData = await getInvoicesData(true); writeCache("expenses", await loadExpenses()); renderInvoices(); };
      });
      document.querySelectorAll('.inv-rematch').forEach(btn => {
        btn.onclick = async () => { await rematchInvoice(btn.dataset.inv); showToast('已取消配對'); invoicesData = await getInvoicesData(true); writeCache("expenses", await loadExpenses()); renderInvoices(); };
      });
      document.querySelectorAll('.inv-restore').forEach(btn => {
        btn.onclick = async () => { await setInvoiceStatus(btn.dataset.inv, '未匹配'); showToast('已還原'); invoicesData = await getInvoicesData(true); writeCache("expenses", await loadExpenses()); renderInvoices(); };
      });
      const tu = document.getElementById('toggleUnmatched');
      if (tu) tu.onclick = () => { invShowUnmatched = !invShowUnmatched; renderInvoices(); };
      const tm = document.getElementById('toggleMatched');
      if (tm) tm.onclick = () => { invShowMatched = !invShowMatched; renderInvoices(); };
      const ti = document.getElementById('toggleIgnored');
      if (ti) ti.onclick = () => { invShowIgnored = !invShowIgnored; renderInvoices(); };
    }

    // 載入發票前後 7 天的消費供手動匹配
    async function loadNearbyExpenses(invNo) {
      const inv = invoicesData.find(i => i.invoice_no === invNo);
      if (!inv) return;
      const el = document.getElementById('nearbyExp_' + invNo);
      if (!el) return;
      el.innerHTML = '<div class="inv-exp-row" style="opacity:.4;">載入中...</div>';
      const allExp = await loadExpenses();
      const invDate = new Date(inv.date + 'T00:00:00');
      const nearby = allExp.filter(e => {
        if (!e.date) return false;
        if (e.status === '已匹配') return false; // 已匹配的不列出
        const d = new Date(e.date + 'T00:00:00');
        const diff = Math.abs((d - invDate) / 86400000);
        return diff <= 7;
      }).sort((a,b) => Math.abs(new Date(a.date)-invDate) - Math.abs(new Date(b.date)-invDate));
      if (!nearby.length) { el.innerHTML = '<div class="inv-exp-row" style="opacity:.4;justify-content:center;">附近沒有可配對的消費</div>'; return; }
      el.innerHTML = nearby.map(e => {
        return '<div class="inv-exp-row" data-exp="' + esc(e.gmail_id) + '" data-row="' + e.row + '">'
          + '<div><div style="font-size:13px;opacity:.5;">' + esc(e.date.slice(5).replace('-','/')) + ' · ' + esc(e.bank) + '</div>'
          + '<div style="font-size:13px;margin-top:2px;">' + esc(e.category&&e.category!=='待分類'?'#'+e.category:'待分類') + '</div></div>'
          + '<div style="font-weight:600;">$' + fmt(e.amount) + '</div></div>';
      }).join('');
      el.querySelectorAll('.inv-exp-row[data-exp]').forEach(row => {
        row.onclick = async () => {
          await doManualMatch(invNo, row.dataset.exp, parseInt(row.dataset.row));
          invExpandedId = null;
          showToast('已匹配');
          invoicesData = await getInvoicesData(true);
          writeCache('expenses', await loadExpenses());
          renderInvoices();
        };
      });
    }

    // 改發票狀態（H欄）
    async function setInvoiceStatus(invNo, status) {
      const inv = invoicesData.find(i => i.invoice_no === invNo);
      if (!inv) return;
      await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/invoices!H'+inv.row+'?valueInputOption=RAW',
        {method:'PUT',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({values:[[status]]})});
    }
    // 手動匹配：發票配到某消費
    async function doManualMatch(invNo, expGmailId, expRow) {
      const inv = invoicesData.find(i => i.invoice_no === invNo);
      if (!inv) return;
      // 發票：已匹配 + 配對消費
      await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values:batchUpdate',
        {method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'RAW',data:[
          {range:'invoices!H'+inv.row,values:[['已匹配']]},
          {range:'invoices!I'+inv.row,values:[[expGmailId]]}
        ]})});
      // 消費：套分類（待分類才套）+ 明細 + 已匹配
      const allExp = await loadExpenses();
      const exp = allExp.find(e => e.row === expRow);
      const newCat = (inv.category && exp && exp.category==='待分類') ? inv.category : (exp?exp.category:'');
      await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values:batchUpdate',
        {method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'RAW',data:[
          {range:'expenses!F'+expRow,values:[[newCat]]},
          {range:'expenses!G'+expRow,values:[['已匹配']]},
          {range:'expenses!H'+expRow,values:[[inv.detail]]}
        ]})});
    }
    // 取消配對（發票回未匹配、消費回待匹配）
    async function rematchInvoice(invNo) {
      const inv = invoicesData.find(i => i.invoice_no === invNo);
      if (!inv) return;
      await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values:batchUpdate',
        {method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'RAW',data:[
          {range:'invoices!H'+inv.row,values:[['未匹配']]},
          {range:'invoices!I'+inv.row,values:[['']]}
        ]})});
      // 找對應消費，回復狀態（保留分類，清明細+狀態）
      if (inv.matched_expense) {
        const allExp = await loadExpenses();
        const exp = allExp.find(e => e.gmail_id === inv.matched_expense);
        if (exp) {
          await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values:batchUpdate',
            {method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'RAW',data:[
              {range:'expenses!G'+exp.row,values:[['待匹配']]},
              {range:'expenses!H'+exp.row,values:[['']]}
            ]})});
        }
      }
    }

    // ===== 同步：Gmail / PDF 工具 =====
    function decodeBase64Url(data) {
      const b64 = data.replace(/-/g,'+').replace(/_/g,'/');
      const bytes = atob(b64);
      const arr = new Uint8Array(bytes.length);
      for (let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
      return new TextDecoder('utf-8').decode(arr);
    }
    function b64ToAB(s) { const b64=s.replace(/-/g,'+').replace(/_/g,'/'); const bin=atob(b64); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a.buffer; }
    function extractBody(payload) {
      function fp(p){ if(p.mimeType==='text/plain'&&p.body&&p.body.data)return decodeBase64Url(p.body.data); if(p.parts){for(const c of p.parts){const r=fp(c);if(r)return r;}} return null; }
      function fh(p){ if(p.mimeType==='text/html'&&p.body&&p.body.data)return decodeBase64Url(p.body.data); if(p.parts){for(const c of p.parts){const r=fh(c);if(r)return r;}} return null; }
      const plain=fp(payload); if(plain)return plain;
      const html=fh(payload);
      if(html)return html.replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').trim();
      return '';
    }
    function findPdfAttachment(payload) {
      if(payload.filename&&payload.filename.toLowerCase().endsWith('.pdf')&&payload.body&&payload.body.attachmentId)return payload.body.attachmentId;
      if(payload.parts){for(const p of payload.parts){const r=findPdfAttachment(p);if(r)return r;}} return null;
    }
    async function extractPdfText(ab, pw) {
      const pdf=await pdfjsLib.getDocument({data:ab,password:pw}).promise;
      let t=''; for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent(); t+=c.items.map(it=>it.str).join(' ')+'\n';} return t;
    }
    async function fetchMsg(id) {
      const res=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+id+'?format=full',{headers:{'Authorization':'Bearer '+accessToken}});
      return res.ok?res.json():null;
    }
    async function gmailSearch(query) {
      // 自動翻頁抓完全部結果（單頁上限 100，多的要跟著 nextPageToken 繼續拿）
      const all = [];
      let pageToken = '';
      do {
        const url = 'https://gmail.googleapis.com/gmail/v1/users/me/messages?q=' + encodeURIComponent(query) + '&maxResults=100' + (pageToken ? '&pageToken=' + pageToken : '');
        const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + accessToken } });
        const d = await res.json();
        if (d.messages) all.push(...d.messages);
        pageToken = d.nextPageToken || '';
      } while (pageToken && all.length < 3000); // 安全上限，避免極端情況抓不完
      return all;
    }

    // ===== 消費 parser =====
    function parseHsbc(body){ if(body.includes('本次新增消費金額'))return null; const d=body.match(/於(\d{4})\/(\d{2})\/(\d{2})/); const a=body.match(/<新臺幣 TWD>([\d,]+)/)||body.match(/新臺幣 TWD[>\s]*([\d,]+)/); const c=body.match(/末四碼(\d{4})/); if(!d||!a)return null; return [{date:d[1]+'-'+d[2]+'-'+d[3],bank:'匯豐',amount:parseInt(a[1].replace(/,/g,''),10),note:c?'卡末四碼'+c[1]:''}]; }
    // 信件內容只有月/日時，用「收信日期」推年份：組出的日期若晚於收信日（跨年），退一年

    // 發票 CSV parser：M=主檔 D=品項
    function parseInvoiceCsv(text) {

      for (const line of text.split(/\r?\n/)) {
        const c = line.replace(/\uFEFF/g,'').trim().split('|');
        if (c[0] === 'M') {
          if (c.length < 8) { current = null; continue; }
          if (c[8] && c[8].includes('作廢')) { current = null; continue; }
          const d = c[3];
          if (!/^\d{8}$/.test(d)) { current = null; continue; }
          current = {
            date: d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8),
            store: c[5]||'', amount: parseInt((c[7]||'0').replace(/,/g,''),10),
            invoice_no: c[6]||'', carrier: c[1]||'', tax_id: c[4]||'', items: []
          };
          results.push(current);
        } else if (c[0] === 'D' && current) {
          current.items.push({ name: c[3]||'', amount: parseInt(c[2]||'0',10) });
        }
      }
      // 組 detail 字串
      for (const inv of results) {
        inv.detail = inv.store + '/' + inv.invoice_no + '：' + inv.items.map(it => it.name + '(' + it.amount + ')').join(' | ');
      }

    // ===== 財政部平台「自行下載」CSV（逗號分隔＋標題列，一列一品項，發票號碼重複多列）=====
    function splitCsvLine(line) {
      const out = []; let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQ) {
          if (ch === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
          else cur += ch;
        } else {
          if (ch === '"') inQ = true;
          else if (ch === ',') { out.push(cur); cur = ''; }
          else cur += ch;
        }
      }
      out.push(cur);
      return out;
    }
    function csvNum(v) { const n = parseFloat(String(v == null ? '' : v).replace(/,/g, '').trim()); return isNaN(n) ? 0 : n; }
    function parseInvoiceTableCsv(text) {
      const lines = text.replace(/\uFEFF/g, '').split(/\r?\n/).filter(l => l.trim());
      if (lines.length < 2) return [];
      const header = splitCsvLine(lines[0]);
      const col = (kw) => header.findIndex(h => h.indexOf(kw) > -1);
      const iNo = col('發票號碼'), iDate = col('發票日期'), iStatus = col('發票狀態');
      const iStore = col('賣方名稱'), iTax = col('賣方統一編號'), iCarrier = col('載具');
      const iItemAmt = col('消費明細_金額'), iItemName = col('消費明細_品名'), iAmt = col('發票金額');
      if (iNo < 0 || iDate < 0) return [];
      const map = {}, order = [], voided = {};
      for (let li = 1; li < lines.length; li++) {
        const c = splitCsvLine(lines[li]);
        const no = (c[iNo] || '').trim();
        if (!no || voided[no]) continue;
        if (iStatus > -1 && (c[iStatus] || '').indexOf('作廢') > -1) { voided[no] = true; delete map[no]; continue; }
        let inv = map[no];
        if (!inv) {
          const raw = (c[iDate] || '').replace(/\D/g, '');
          let date = '';
          if (raw.length === 8) date = raw.slice(0,4) + '-' + raw.slice(4,6) + '-' + raw.slice(6,8);
          else if (raw.length === 7) date = (parseInt(raw.slice(0,3), 10) + 1911) + '-' + raw.slice(3,5) + '-' + raw.slice(5,7); // 民國年
          if (!date) continue;
          inv = map[no] = {
            date, store: iStore > -1 ? (c[iStore] || '') : '', amount: iAmt > -1 ? csvNum(c[iAmt]) : 0,
            invoice_no: no, carrier: iCarrier > -1 ? (c[iCarrier] || '') : '', tax_id: iTax > -1 ? (c[iTax] || '') : '',
            items: [], _sum: 0, _hasItemAmt: false
          };
          order.push(inv);
        }
        const itemAmt = iItemAmt > -1 ? csvNum(c[iItemAmt]) : 0;
        if (iItemAmt > -1 && (c[iItemAmt] || '').trim() !== '') { inv._sum += itemAmt; inv._hasItemAmt = true; }
        if (iItemName > -1 && (c[iItemName] || '').trim()) inv.items.push({ name: (c[iItemName] || '').trim(), amount: itemAmt });
      }
      const results = order.filter(inv => !voided[inv.invoice_no]);
      for (const inv of results) {
        if (inv._hasItemAmt) inv.amount = Math.round(inv._sum * 100) / 100; // 每列金額是品項金額，總額用加總（含負數折扣列）
        delete inv._sum; delete inv._hasItemAmt;
        inv.detail = inv.store + '/' + inv.invoice_no + '：' + inv.items.map(it => it.name + '(' + it.amount + ')').join(' | ');
      }
      return results;
    }

          await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values:batchUpdate',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'RAW',data:data.slice(i,i+100)})});
        }
      }
      return { added: invRows.length, skipped: parsedInvoices.length - fresh.length };
    }

    // ===== 手動上傳發票 CSV（給沒設定每月彙整信的用戶）=====
    function pickInvoiceCsv(btn) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.csv,text/csv';
      input.onchange = async () => {
        const f = input.files && input.files[0];
        if (!f) return;
        const orig = btn.textContent;
        btn.disabled = true; btn.textContent = '匯入中...';
        try { await handleInvoiceCsvFile(f); }
        catch (err) { showToast('匯入失敗：' + (err && err.message ? err.message : '請再試一次')); }
        if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = orig; }
      };
      input.click();
    }
    async function handleInvoiceCsvFile(file) {
      const buf = await file.arrayBuffer();
      let text = new TextDecoder('utf-8').decode(buf);
      if (text.indexOf('\uFFFD') > -1) { try { text = new TextDecoder('big5').decode(buf); } catch (e) {} } // 舊版下載檔可能是 Big5
      const parsed = parseAnyInvoiceCsv(text);
      if (!parsed.length) { showToast('無法解析此檔案，請確認是財政部電子發票 CSV'); return; }
      const r = await importParsedInvoices(parsed);
      // 刷新快取與記憶體
      const [freshExp, freshInv] = await Promise.all([loadExpenses(), loadInvoices()]);
      writeCache('expenses', freshExp); writeCache('invoices', freshInv);
      expensesData = freshExp; invoicesData = freshInv;
      showToast(r.added ? ('匯入完成：新增 ' + r.added + ' 張發票' + (r.skipped ? '，略過 ' + r.skipped + ' 張已存在' : '')) : ('沒有新發票（' + r.skipped + ' 張已存在）'));
      renderInvoices();
    }

    // ===== 同步主流程 =====
    function isEnabled(bank, type) {
      return syncOptions[bank] && syncOptions[bank][type];
    }

    async function doSync() {
      const syncBtn = document.getElementById('syncBtn');
      syncBtn.disabled = true;
      const origText = syncBtn.textContent;
      const t0 = performance.now();
      let expAdded = 0, billAdded = 0, acctAdded = 0, invAdded = 0;

      try {
        const lastSync = await getLastSync();
        let dateFilter, invoiceDateFilter;
        if (lastSync) {
          dateFilter = 'after:' + lastSync;
          invoiceDateFilter = 'after:' + lastSync;
        } else {
          // 首次同步：用用戶自選的起始日期（若沒選過則先跳選擇框，見 doSync 呼叫處）
          const startDate = await getSyncStartDate(); // 格式 YYYY-MM-DD
          const [y,m,d] = startDate.split('-');
          dateFilter = 'after:' + y + '/' + parseInt(m) + '/' + parseInt(d);
          invoiceDateFilter = dateFilter; // 發票也從同一天開始找（雙月信件會自然涵蓋前一期）
        }

        // ---- 消費 ----
        syncBtn.textContent = '同步消費...';
        const existingExpIds = await getExistingExpIds();
        const expRows = [];
        for (const src of EXPENSE_SOURCES) {
          if (!isEnabled(src.bank, 'expense')) continue;
          const pw = sessionPasswords[src.bank] || '';
          if (src.type === 'pdf' && !pw) continue;
          const msgs = await gmailSearch(src.query + ' ' + dateFilter);
          const BATCH = src.type==='pdf' ? 5 : 10;
          for (let i=0;i<msgs.length;i+=BATCH) {
            const batch = msgs.slice(i,i+BATCH);
            await Promise.all(batch.map(async (msg) => {
              const md = await fetchMsg(msg.id); if(!md) return;
              let parsed = null;
              if (src.type === 'pdf') {
                const attId = findPdfAttachment(md.payload); if(!attId) return;
                const attData = await (await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+msg.id+'/attachments/'+attId,{headers:{'Authorization':'Bearer '+accessToken}})).json();
                try { parsed = src.parse(await extractPdfText(b64ToAB(attData.data), pw), new Date(parseInt(md.internalDate))); } catch(e){ return; }
              } else { parsed = src.parse(md); }
              if (parsed) parsed.forEach((p,j) => { const mid=msg.id+'_'+j; if(!existingExpIds.has(mid)) expRows.push([p.date,p.bank,p.amount,p.note,mid,'待分類','待匹配','','','']); });
            }));
          }
        }
        if (expRows.length) {
          await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/expenses!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({values:expRows})});
          expAdded = expRows.length;
        }

        // ---- 帳戶(轉帳/存款) ----
        syncBtn.textContent = '同步帳戶...';
        await ensureTransfersSheet();
        const existingTrIds = await getExistingTransferIds();
        const trRows = [];
        for (const src of ACCOUNT_SOURCES) {
          if (!isEnabled(src.bank, 'account')) continue;
          const msgs = await gmailSearch(src.query + ' ' + dateFilter);
          for (let i=0;i<msgs.length;i+=10) {
            const batch = msgs.slice(i,i+10);
            await Promise.all(batch.map(async (msg) => {
              if (existingTrIds.has(msg.id)) return;
              const md = await fetchMsg(msg.id); if(!md) return;
              const p = src.parse(extractBody(md.payload));
              if (p) {
                // 永豐等 parser 可能帶收款對象/序號 → 存進 note 方便辨識（尤其分辨轉給自己 vs 給別人）
                const note = p.to_account ? ('轉給 ' + p.to_account + (p.seq?' ('+p.seq+')':'')) : (p.seq||'');
                trRows.push([p.date,p.bank,p.type,p.from_account,p.to_account,p.amount,msg.id,note]);
              }
            }));
          }
        }
        // 台新無卡提款（設定通知拿金額＋結果通知證明有執行，配對成功才記，見 syncTaishinAtmWithdrawals 註解）
        if (isEnabled('台新', 'account')) {
          const taishinRows = await syncTaishinAtmWithdrawals(dateFilter, existingTrIds);
          trRows.push(...taishinRows);
        }
        if (trRows.length) {
          await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/transfers!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({values:trRows})});
          acctAdded = trRows.length;
          await updateAccountBalances(trRows);
        }

        // ---- 帳單 ----
        syncBtn.textContent = '同步帳單...';
        await ensureBillsSheet();
        const existingBills = await getExistingBillKeys();
        const billRows = [];
        const seenKeys = {};
        // 歷史帳單自動標已繳：繳款截止日在今天前 >60 天者視為歷史（60天＝放行最近一整期）。
        // 只標狀態、不扣餘額——有設起始餘額者該款項已含在起始餘額、沒設者本就無餘額可扣。
        // due_date 為空時無法判斷，保守當「未繳」（不自動標）。
        let autoPaidCount = 0;
        const isHistoricalBill = (dueDate) => {
          if (!dueDate) return false;
          const due = new Date(dueDate + 'T00:00:00');
          if (isNaN(due.getTime())) return false;
          const now = new Date(); now.setHours(0,0,0,0);
          return (now - due) / 86400000 > 60;
        };
        for (const src of BILL_SOURCES) {
          if (!isEnabled(src.bank, 'bill')) continue;
          const pw = sessionPasswords[src.bank] || '';
          if (!pw) continue;
          const msgs = await gmailSearch('from:'+src.sender+' has:attachment filename:pdf ' + dateFilter);
          for (const msg of msgs) {
            const md = await fetchMsg(msg.id); if(!md) continue;
            const attId = findPdfAttachment(md.payload); if(!attId) continue;
            const attData = await (await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+msg.id+'/attachments/'+attId,{headers:{'Authorization':'Bearer '+accessToken}})).json();
            try {
              const bill = src.parse(await extractPdfText(b64ToAB(attData.data), pw));
              if (bill && bill.bill_date) {
                const key = src.bank + '_' + bill.bill_date.slice(0,7);
                if (!existingBills.has(key) && !seenKeys[key]) {
                  seenKeys[key]=true;
                  const historical = isHistoricalBill(bill.due_date);
                  if (historical) autoPaidCount++;
                  billRows.push([src.bank,bill.bill_date,bill.due_date||'',bill.total_amount,bill.min_payment||0, historical?'已繳':'未繳', key]);
                }
              }
            } catch(e){}
          }
        }
        if (billRows.length) {
          // 寫入前重新檢查一次（縮小「兩次同步交疊」的競態窗口：中間可能已有別次同步寫入同 key）
          const freshExisting = await getExistingBillKeys();
          const toWrite = billRows.filter(r => !freshExisting.has(r[6]));
          if (toWrite.length) {
            await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/bills!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({values:toWrite})});
          }
          billAdded = toWrite.length;
        }

        // ---- 發票 ----
        if (syncOptions['發票'] && syncOptions['發票'].enabled) {
          syncBtn.textContent = '同步發票...';
          const msgs = await gmailSearch('from:einvoice@einvoice.nat.gov.tw ' + invoiceDateFilter);
          const parsedInvoices = [];
          for (const msg of msgs) {
            const md = await fetchMsg(msg.id); if(!md) continue;
            const att = findCsvAttachment(md.payload); if(!att) continue;
            const attData = await (await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+msg.id+'/attachments/'+att.id,{headers:{'Authorization':'Bearer '+accessToken}})).json();
            try {
              const csvText = decodeBase64Url(attData.data);
              parsedInvoices.push(...parseInvoiceCsv(csvText));
            } catch(e){}
          }
          if (parsedInvoices.length) {
            // 去重＋套規則＋自動比對＋寫入（與手動上傳 CSV 共用 importParsedInvoices）
            invAdded = (await importParsedInvoices(parsedInvoices)).added;
          }
        }

        const now = new Date();
        const todayStr = now.getFullYear()+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+String(now.getDate()).padStart(2,'0');
        await setLastSync(todayStr);

        const sec = ((performance.now()-t0)/1000).toFixed(1);
        showToast('同步完成！消費+'+expAdded+' 帳戶+'+acctAdded+' 帳單+'+billAdded+' 發票+'+invAdded+'（'+sec+'秒）');
        if (autoPaidCount > 0) {
          // 歷史帳單自動標已繳的告知（延遲彈出，不蓋掉主 toast）
          setTimeout(() => showToast('已自動將 ' + autoPaidCount + ' 筆較早的帳單標為已繳，可到帳單頁的已繳區還原'), 2600);
        }
        await refreshAllCache();
        await loadAndRender();
      } catch(e) {
        showToast('同步失敗：'+e.message);
      }
      syncBtn.disabled = false;
      syncBtn.textContent = origText;
    }

    async function getSyncStartDate() {

    // 首次同步前跳出的起始日期選擇框
    function askSyncStartDate() {
      return new Promise((resolve) => {
        const today = new Date();
        const opts = [
          { label: '最近 1 個月', days: 30 },
          { label: '最近 3 個月', days: 90 },
          { label: '最近半年', days: 182 },
          { label: '今年 1/1 起', special: 'year' },
        ];
        const overlay = document.createElement('div');
        overlay.className = 'qa-overlay';
        function calcDate(opt) {
          if (opt.special === 'year') return today.getFullYear() + '-01-01';
          const d = new Date(today); d.setDate(d.getDate() - opt.days);
          return d.toISOString().slice(0,10);
        }
        let html = '<div class="qa-panel"><div class="qa-title">第一次同步：要抓多久以前的資料？</div>'
          + '<div style="font-size:12px;color:#e67e00;background:#fff8e8;border-radius:8px;padding:10px 12px;margin-bottom:14px;">選擇後只會同步這個日期<b>之後</b>的資料，之前的資料不會自動補上。之後可到「設定」重新選擇範圍。</div>'
          + '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">'
          + opts.map((o,i) => '<button class="sync-start-opt" data-idx="' + i + '" style="padding:12px;border-radius:10px;border:1px solid #dde8e5;background:#fff;font-size:14px;cursor:pointer;text-align:left;">' + o.label + '</button>').join('')
          + '</div>'
          + '<div class="qa-label">或自訂日期</div>'
          + '<input type="date" id="customStartDate" class="qa-input" value="' + today.toISOString().slice(0,10) + '" />'
          + '<button id="customStartBtn" style="width:100%;background:#00897b;color:#fff;border:none;border-radius:10px;padding:12px;font-weight:600;cursor:pointer;">使用這個日期</button>'
          + '</div>';
        overlay.innerHTML = html;
        document.body.appendChild(overlay);
        overlay.querySelectorAll('.sync-start-opt').forEach(btn => {
          btn.onclick = () => {
            const opt = opts[parseInt(btn.dataset.idx)];
            overlay.remove();
            resolve(calcDate(opt));
          };
        });
        document.getElementById('customStartBtn').onclick = () => {
          const v = document.getElementById('customStartDate').value;
          overlay.remove();
          resolve(v || today.toISOString().slice(0,10));
        };
      });
    }

        await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+':batchUpdate',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({requests:[{insertDimension:{range:{sheetId,dimension:'ROWS',startIndex:0,endIndex:1}}}]})});
        await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/accounts!A1:B1?valueInputOption=RAW',{method:'PUT',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({values:[HEADER]})});
