    async function updateAccountBalances(trRows) {
      await ensureAccountsSheet();
      const res=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/accounts!A2:B100000',{headers:{'Authorization':'Bearer '+accessToken}});
      const d=await res.json(); const rows=d.values||[];
      const balMap={}; const rowNumMap={};
      rows.forEach((r,i)=>{ if(r[0]){ balMap[r[0]]=parseFloat(r[1]||'0'); rowNumMap[r[0]]=i+2; } });
      for (const tr of trRows) {
        const [date,bank,type,,,amount]=tr; let delta=0;
        if(['轉入','收入'].includes(type)) delta=amount;
        else if(['轉出','提款','提領'].includes(type)) delta=-amount;
        if(delta!==0) balMap[bank]=(balMap[bank]||0)+delta;
      }
      const updates=[]; const appends=[];
      for(const bank in balMap){ if(rowNumMap[bank]) updates.push({range:'accounts!B'+rowNumMap[bank],values:[[balMap[bank]]]}); else appends.push([bank,balMap[bank]]); }
      if(updates.length) await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values:batchUpdate',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'RAW',data:updates})});
      if(appends.length) await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/accounts!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({values:appends})});
    }
    function findCsvAttachment(payload) {
      if (payload.filename && payload.filename.toLowerCase().endsWith('.csv') && payload.body && payload.body.attachmentId) return { id: payload.body.attachmentId, name: payload.filename };
      if (payload.parts) for (const p of payload.parts) { const r = findCsvAttachment(p); if(r) return r; }
      return null;
    }

      qaState.amount = document.getElementById('qaAmount').value;

    async function saveQuickAdd(force) {
      syncQaInputs();
      const s = qaState;
      const amount = parseFloat(s.amount);
      if (!s.amount || isNaN(amount) || amount <= 0) { showToast('請輸入金額'); return; }
      const saveBtn = document.getElementById('qaSave');
      saveBtn.disabled = true; saveBtn.textContent = '儲存中...';

      // 重複檢查
      if (!force) {
        const dup = await checkQaDuplicate(s, amount);
        if (dup) {
          qaState.warning = '⚠️ 疑似重複記錄（同日期同金額同銀行），確定要新增？';
          renderQuickAdd();
          return;
        }
      }

      const manualId = 'manual_' + Date.now();
      if (s.type === '支出') {
        // 寫 expenses：日期/銀行/金額/備註/id/分類/狀態/明細/來源/排除
        await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/expenses!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',
          {method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({values:[[s.date,s.bank,amount,s.note,manualId,'待分類','待匹配','','manual','']]})});
      } else if (s.type === '互轉') {
        await ensureTransfersSheet();
        const mutualNote = '互轉 ' + s.bank + '→' + s.toBank + (s.note?' '+s.note:'');
        const pairId = 'pair_' + Date.now();
        // 兩筆共用 pairId（J 欄），刪除時靠它可靠成對處理。G 欄的 _out/_in 保留為 fallback
        await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/transfers!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',
          {method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({values:[
            [s.date,s.bank,'轉出','','',amount,manualId+'_out',mutualNote,'',pairId],
            [s.date,s.toBank,'轉入','','',amount,manualId+'_in',mutualNote,'',pairId]
          ]})});
      } else {
        await ensureTransfersSheet();
        await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/transfers!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',
          {method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({values:[[s.date,s.bank,s.type,'','',amount,manualId,s.note||'']]})});
      }

      // 更新餘額
      const deltas = {};
      if (s.type === '支出') { if (s.instantDeduct) deltas[s.bank] = -amount; }
      else if (['轉出'].includes(s.type)) deltas[s.bank] = -amount;
      else if (['轉入','收入'].includes(s.type)) deltas[s.bank] = amount;
      else if (s.type === '互轉') { deltas[s.bank] = -amount; deltas[s.toBank] = amount; }
      await applyBalanceDeltas(deltas);

      // 更新快取
      writeCache('expenses', await loadExpenses());
      writeCache('transfers', await loadAllTransfers());
      writeCache('accounts', await loadAccounts());

      closeQuickAdd();
      showToast('已記帳');
      await loadAndRender();
    }

    async function checkQaDuplicate(s, amount) {
      if (s.type === '支出') {
        const exps = await getExpensesData();
        return exps.some(e => e.date === s.date && Number(e.amount) === amount && e.bank === s.bank);
      } else {
        const trs = await getTransfersData();
        const t = s.type === '互轉' ? '轉出' : s.type;
        return trs.some(x => x.date === s.date && Number(x.amount) === amount && x.bank === s.bank && x.type === t);
      }
    }

    async function applyBalanceDeltas(deltas) {
      await ensureAccountsSheet();
      const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/accounts!A2:B100000',{headers:{'Authorization':'Bearer '+accessToken}});
      const d = await res.json(); const rows = d.values||[];
      const rowNumMap = {}; const balMap = {};
      rows.forEach((r,i)=>{ if(r[0]){ balMap[r[0]]=parseFloat(r[1]||'0'); rowNumMap[r[0]]=i+2; } });
      const updates=[]; const appends=[];
      for (const bank in deltas) {
        const nb = (balMap[bank]||0) + deltas[bank];
        if (rowNumMap[bank]) updates.push({range:'accounts!B'+rowNumMap[bank],values:[[nb]]});
        else appends.push([bank, nb]);
      }
      if(updates.length) await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values:batchUpdate',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'RAW',data:updates})});
      if(appends.length) await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+spreadsheetId+'/values/accounts!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({values:appends})});
    }

    // ===== 同步按鈕 =====
    document.getElementById('syncBtn').onclick = doSync;
  </script>
</body>
